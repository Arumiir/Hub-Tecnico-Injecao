<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Controle de Produção — Supervisor</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#f2f2f7;
    --card:#ffffff;
    --text:#1c1c1e;
    --muted:#8e8e93;
    --line:#e5e5ea;

    --blue:#007aff;
    --blue-soft:#eaf3ff;

    --green:#34c759;
    --green-soft:#e9f8ed;

    --yellow:#ffcc00;
    --yellow-soft:#fff8d9;

    --red:#ff3b30;
    --red-soft:#ffebe9;

    --danger:#ff3b30;

    --shadow:0 2px 12px rgba(0,0,0,.045);
    --radius:18px;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:var(--bg);
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
    -webkit-font-smoothing:antialiased;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:default;
}

.hidden{
    display:none !important;
}

/* =========================
   APP
========================= */

.container{
    width:min(100%, 760px);
    margin:0 auto;
    padding:
        max(14px, env(safe-area-inset-top))
        16px
        calc(28px + env(safe-area-inset-bottom));
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:20;

    margin:
        calc(-1 * max(14px, env(safe-area-inset-top)))
        -16px
        18px;

    padding:
        calc(16px + max(14px, env(safe-area-inset-top)))
        18px
        16px;

    background:rgba(242,242,247,.88);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    border-bottom:1px solid rgba(0,0,0,.06);
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
}

.header-brand{
    min-width:0;
}

.header h1{
    margin:0;
    font-size:21px;
    line-height:1.15;
    font-weight:750;
    letter-spacing:-.45px;
}

.header-subtitle{
    margin:5px 0 0;
    color:var(--muted);
    font-size:14px;
    font-weight:500;
}

.user-name{
    margin-top:14px;
    font-size:14px;
    font-weight:650;
    color:var(--text);
}

.logout{
    flex:none;
    border:0;
    background:rgba(255,255,255,.8);
    color:var(--blue);
    border-radius:12px;
    padding:9px 13px;
    font-size:14px;
    font-weight:600;
    box-shadow:0 1px 4px rgba(0,0,0,.04);
}

/* =========================
   CONTEXTO
========================= */

.controls{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
}

.control-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.field{
    min-width:0;
}

.field label{
    display:block;
    margin:0 0 7px 2px;
    color:var(--muted);
    font-size:12px;
    font-weight:650;
}

input,
select,
textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:13px;
    padding:12px 13px;
    background:#fff;
    color:var(--text);
    outline:none;
    transition:
        border-color .15s ease,
        box-shadow .15s ease,
        background .15s ease;
}

input,
select{
    min-height:46px;
}

textarea{
    resize:vertical;
    line-height:1.4;
}

input:focus,
select:focus,
textarea:focus{
    border-color:rgba(0,122,255,.45);
    box-shadow:0 0 0 3px rgba(0,122,255,.10);
}

/* =========================
   TABS
========================= */

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;

    padding:4px;
    margin-bottom:16px;

    background:#e5e5ea;
    border-radius:14px;
}

.tab{
    border:0;
    background:transparent;
    color:#6d6d72;
    padding:10px 12px;
    border-radius:11px;
    font-size:14px;
    font-weight:650;
    transition:.18s ease;
}

.tab.active{
    background:#fff;
    color:var(--text);
    box-shadow:0 1px 4px rgba(0,0,0,.08);
}

/* =========================
   CARDS DE MÁQUINA
========================= */

.machine-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:13px;
    box-shadow:var(--shadow);
}

.machine-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
}

.machine-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:19px;
    font-weight:750;
    letter-spacing:-.3px;
}

.machine-title::before{
    content:"";
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 0 4px var(--blue-soft);
}

.leader-name{
    color:var(--muted);
    font-size:12px;
    font-weight:500;
    text-align:right;
}

/* =========================
   HORAS
========================= */

.hours-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.total-box{
    grid-column:1 / -1;
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:58px;
    transition:.15s ease;
}

.total-box.status-green{
    background:var(--green-soft);
    color:#248a3d;
}

.total-box.status-yellow{
    background:var(--yellow-soft);
    color:#9a7900;
}

.total-box.status-red{
    background:var(--red-soft);
    color:#c72e25;
}

.total-label{
    font-size:12px;
    font-weight:650;
}

.total-value{
    font-size:19px;
    font-weight:750;
    letter-spacing:-.3px;
}

.section-label{
    display:block;
    margin:17px 0 7px 2px;
    color:var(--muted);
    font-size:12px;
    font-weight:650;
}

.save-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:9px;
    margin-top:14px;
}

.save-btn{
    min-height:46px;
    border:0;
    background:var(--green);
    color:#fff;
    border-radius:13px;
    padding:11px 15px;
    font-weight:700;
    box-shadow:0 2px 6px rgba(52,199,89,.18);
}

.reset-btn{
    min-height:46px;
    border:0;
    background:#f2f2f7;
    color:var(--blue);
    border-radius:13px;
    padding:11px 15px;
    font-weight:650;
}

/* =========================
   OBSERVAÇÃO DO LÍDER
========================= */

.leader-observation{
    background:#f7f7f9;
    border:1px solid var(--line);
    border-radius:13px;
    padding:12px 13px;
    font-size:13px;
    line-height:1.45;
    color:#48484a;
}

/* =========================
   FECHAMENTO
========================= */

.closing-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px;
    margin-top:15px;
    box-shadow:var(--shadow);
}

.closing-card h2{
    margin:0 0 4px;
    font-size:18px;
    font-weight:750;
    letter-spacing:-.2px;
}

.closing-subtitle{
    margin:0 0 13px;
    color:var(--muted);
    font-size:13px;
}

.closing-text{
    min-height:250px;
    resize:vertical;
    background:#f7f7f9;
    border-color:var(--line);
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    font-size:13px;
    line-height:1.55;
}

.copy-btn{
    width:100%;
    min-height:46px;
    margin-top:10px;
    border:0;
    background:var(--blue);
    color:#fff;
    border-radius:13px;
    padding:11px 15px;
    font-weight:700;
}

/* =========================
   DRIVE
========================= */

.drive-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:13px;
    box-shadow:var(--shadow);
}

.drive-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:11px;
}

.drive-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:19px;
    font-weight:750;
    letter-spacing:-.3px;
}

.drive-title::before{
    content:"";
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 0 4px var(--blue-soft);
}

.problem{
    padding:11px 0;
    border-bottom:1px solid #f0f0f2;
    font-size:14px;
    line-height:1.45;
    color:#3a3a3c;
}

.problem:last-of-type{
    border-bottom:0;
}

.problem-category{
    font-weight:700;
    color:var(--text);
}

.no-problems{
    padding:12px;
    border-radius:12px;
    background:#f7f7f9;
    color:var(--muted);
    font-size:13px;
}

.drive-card .copy-btn{
    margin-top:13px;
    background:#f2f2f7;
    color:var(--blue);
}

/* =========================
   LOADING / EMPTY
========================= */

.loading,
.empty{
    background:var(--card);
    border-radius:var(--radius);
    padding:32px 20px;
    text-align:center;
    color:var(--muted);
    box-shadow:var(--shadow);
    font-size:14px;
}

.loading{
    min-height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:
        calc(20px + env(safe-area-inset-bottom));

    transform:
        translate(-50%, 10px);

    width:max-content;
    max-width:calc(100% - 32px);

    background:rgba(28,28,30,.94);
    color:#fff;

    padding:11px 16px;
    border-radius:14px;

    font-size:13px;
    font-weight:600;

    opacity:0;
    pointer-events:none;

    transition:
        opacity .2s ease,
        transform .2s ease;

    z-index:1000;

    box-shadow:0 5px 20px rgba(0,0,0,.18);
}

.toast.show{
    opacity:1;
    transform:translate(-50%, 0);
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:520px){

    .container{
        width:100%;
        padding-left:12px;
        padding-right:12px;
    }

    .header{
        margin-left:-12px;
        margin-right:-12px;
        padding-left:16px;
        padding-right:16px;
    }

    .header h1{
        font-size:20px;
    }

    .controls{
        padding:15px;
    }

    .control-grid{
        grid-template-columns:1fr 1fr;
        gap:9px;
    }

    .machine-card,
    .drive-card,
    .closing-card{
        padding:16px;
    }

    .machine-header{
        align-items:flex-start;
    }

    .leader-name{
        max-width:45%;
    }
}

@media(max-width:360px){

    .header h1{
        font-size:18px;
    }

    .logout{
        padding:8px 10px;
    }

    .machine-title,
    .drive-title{
        font-size:18px;
    }

    .save-row{
        grid-template-columns:1fr;
    }

    .reset-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="header-top">

            <div class="header-brand">
                <h1>CONTROLE DE PRODUÇÃO</h1>

                <p class="header-subtitle">
                    Setor de Injeção · Supervisor
                </p>
            </div>

            <button
                class="logout"
                onclick="logout()">
                Sair
            </button>

        </div>

        <div
            id="userName"
            class="user-name">
        </div>

    </header>


    <!-- =========================
         FILTROS
    ========================= -->

    <section class="controls">

        <div class="control-grid">

            <!-- DATA -->

            <div class="field">
                <label for="data">
                    Data
                </label>

                <input
                    type="date"
                    id="data">
            </div>


            <!-- TURNO -->

            <div class="field">
                <label for="turno">
                    Turno
                </label>

                <select id="turno">

                    <option value="1º turno">
                        1º turno
                    </option>

                    <option value="2º turno">
                        2º turno
                    </option>

                    <option value="3º turno">
                        3º turno
                    </option>

                </select>
            </div>


            <!-- SETOR -->

            <div class="field">
                <label for="setor">
                    Setor
                </label>

                <select id="setor">

                    <option value="A">
                        A
                    </option>

                    <option value="B">
                        B
                    </option>

                    <option value="C">
                        C
                    </option>

                </select>
            </div>

        </div>

    </section>


    <!-- =========================
         ABAS
    ========================= -->

    <div class="tabs">

        <button
            id="tabHoras"
            class="tab active"
            onclick="mostrarAba('horas')">
            Horas baixadas
        </button>


        <button
            id="tabDrive"
            class="tab"
            onclick="mostrarAba('drive')">
            Drive
        </button>

    </div>


    <main>

        <!-- =========================
             HORAS
        ========================= -->

        <section id="abaHoras">

            <div
                id="listaHoras"
                class="loading">
                Carregando...
            </div>


            <div
                id="fechamento"
                class="closing-card hidden">

                <h2>
                    Fechamento do turno
                </h2>

                <p class="closing-subtitle">
                    Texto pronto para copiar e enviar.
                </p>

                <textarea
                    id="textoFechamento"
                    class="closing-text"
                    readonly>
                </textarea>


                <button
                    class="copy-btn"
                    onclick="copiarFechamento()">
                    Copiar horas
                </button>

            </div>

        </section>


        <!-- =========================
             DRIVE
        ========================= -->

        <section
            id="abaDrive"
            class="hidden">

            <div
                id="listaDrive"
                class="loading">
                Carregando...
            </div>

        </section>

    </main>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

const SUPABASE_URL =
    "https://icajmncojvidhrqlbevq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vQFsGutuZDHBruMghZkQYQ_BSwEBXFp";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const shiftTargets = {

    "1º turno":
        8 * 60 + 48,

    "2º turno":
        8 * 60 + 36,

    "3º turno":
        6 * 60 + 36

};


let session = null;
let perfil = null;
let dados = [];


/* =========================
   INICIALIZAÇÃO
========================= */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const hoje =
            new Date();


        const ano =
            hoje.getFullYear();


        const mes =
            String(
                hoje.getMonth() + 1
            ).padStart(2,"0");


        const dia =
            String(
                hoje.getDate()
            ).padStart(2,"0");


        document.getElementById(
            "data"
        ).value =
            `${ano}-${mes}-${dia}`;


        document
            .getElementById("data")
            .addEventListener(
                "change",
                carregarDados
            );


        document
            .getElementById("turno")
            .addEventListener(
                "change",
                carregarDados
            );


        document
            .getElementById("setor")
            .addEventListener(
                "change",
                carregarDados
            );


        await verificarAcesso();

    }
);


/* =========================
   AUTENTICAÇÃO
========================= */

async function verificarAcesso(){

    const {
        data:{
            session:currentSession
        }
    } =
        await supabaseClient.auth.getSession();


    if(!currentSession){

        window.location.href =
            "index.html";

        return;
    }


    session =
        currentSession;


    const {
        data:usuario,
        error
    } =
        await supabaseClient
            .from("usuarios")
            .select("*")
            .eq("id",session.user.id)
            .eq("ativo",true)
            .single();


    if(error || !usuario){

        alert(
            "Usuário sem cadastro no sistema."
        );

        await supabaseClient.auth.signOut();

        window.location.href =
            "index.html";

        return;
    }


    if(usuario.perfil !== "supervisor"){

        alert(
            "Acesso restrito ao supervisor."
        );

        window.location.href =
            "lider.html";

        return;
    }


    perfil =
        usuario;


    document.getElementById(
        "userName"
    ).textContent =
        usuario.nome;


    await carregarDados();

}


/* =========================
   CARREGAR DADOS
========================= */

async function carregarDados(){

    const data =
        document.getElementById(
            "data"
        ).value;


    const turno =
        document.getElementById(
            "turno"
        ).value;


    const setor =
        document.getElementById(
            "setor"
        ).value;


    if(!data || !turno || !setor){

        return;
    }


    /* =========================
       ESTADO DE CARREGAMENTO
    ========================= */

    document.getElementById(
        "listaHoras"
    ).innerHTML =
        `<div class="loading">
            Carregando...
        </div>`;


    document.getElementById(
        "listaDrive"
    ).innerHTML =
        `<div class="loading">
            Carregando...
        </div>`;


    document
        .getElementById("fechamento")
        .classList.add("hidden");


    /*
       IMPORTANTE:

       A consulta agora filtra
       simultaneamente:

       DATA
       TURNO
       SETOR

       Isso impede que apontamentos
       de outro setor apareçam.
    */

    const {
        data:turnos,
        error
    } =
        await supabaseClient
            .from("turnos")
            .select(`
                id,
                data,
                turno,
                setor,
                lider_id,
                usuarios (
                    nome
                ),
                apontamentos (
                    id,
                    maquina,
                    hora_boa,
                    reposicao,
                    total_baixado,
                    saldo,
                    observacao,
                    nota_supervisor,
                    ocorrencias (
                        id,
                        categoria,
                        descricao
                    )
                )
            `)
            .eq(
                "data",
                data
            )
            .eq(
                "turno",
                turno
            )
            .eq(
                "setor",
                setor
            );


    if(error){

        console.error(
            "Erro Supabase:",
            error
        );


        document.getElementById(
            "listaHoras"
        ).innerHTML =
            `<div class="empty">
                Erro ao carregar os dados.
                <br><br>
                ${escapeHtml(
                    error.message ||
                    "Erro desconhecido."
                )}
            </div>`;


        document.getElementById(
            "listaDrive"
        ).innerHTML =
            `<div class="empty">
                Erro ao carregar os dados.
            </div>`;


        return;
    }


    dados = [];


    /*
       Cada turno retornado já pertence
       ao setor selecionado.
    */

    for(
        const turnoItem of
        (turnos || [])
    ){

        /*
           Proteção adicional no frontend.

           Mesmo que futuramente a consulta
           seja alterada, não deixamos passar
           um turno de outro setor.
        */

        if(
            turnoItem.setor !== setor
        ){

            continue;
        }


        for(
            const apontamento of
            (turnoItem.apontamentos || [])
        ){

            dados.push({

                ...apontamento,

                lider_nome:
                    turnoItem.usuarios?.nome ||
                    "—",

                turno_id:
                    turnoItem.id,

                setor:
                    turnoItem.setor

            });

        }

    }


    /*
       Caso mais de um líder tenha apontado
       a mesma máquina no mesmo setor/turno,
       usamos o último registro encontrado.
    */

    const mapa =
        new Map();


    for(
        const item of dados
    ){

        const maquinaNumero =
            normalizarMaquina(
                item.maquina
            );


        if(
            maquinaNumero === null
        ){

            continue;
        }


        mapa.set(
            maquinaNumero,
            {
                ...item,
                maquina:
                    maquinaNumero
            }
        );

    }


    dados =
        Array.from(
            mapa.values()
        )
        .sort(
            (a,b) =>
                a.maquina -
                b.maquina
        );


    renderHoras();

    renderDrive();

}


/* =========================
   HORAS
========================= */

function renderHoras(){

    const container =
        document.getElementById(
            "listaHoras"
        );


    if(!dados.length){

        container.innerHTML = `

            <div class="empty">

                Nenhum apontamento encontrado.

                <br><br>

                <strong>
                    ${escapeHtml(
                        getContextoTexto()
                    )}
                </strong>

            </div>

        `;


        document
            .getElementById("fechamento")
            .classList.add("hidden");


        return;
    }


    container.innerHTML = "";


    for(
        const item of dados
    ){

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "machine-card";


        const total =
            Number(
                item.total_baixado || 0
            );


        const status =
            getStatusClass(
                total
            );


        const maquina =
            formatMachine(
                item.maquina
            );


        card.innerHTML = `

            <div class="machine-header">

                <div class="machine-title">
                    ${maquina}
                </div>

                <div class="leader-name">
                    Líder:
                    ${escapeHtml(
                        item.lider_nome
                    )}
                </div>

            </div>


            <div class="hours-grid">

                <div class="field">

                    <label>
                        Hora boa
                    </label>

                    <input
                        type="text"
                        value="${formatMinutes(
                            item.hora_boa
                        )}"
                        data-field="hora_boa">

                </div>


                <div class="field">

                    <label>
                        Reposição
                    </label>

                    <input
                        type="text"
                        value="${formatMinutes(
                            item.reposicao
                        )}"
                        data-field="reposicao">

                </div>


                <div class="total-box ${status}">

                    <div class="total-label">
                        Total baixado
                    </div>

                    <div
                        class="total-value"
                        data-total>
                        ${formatMinutes(
                            item.total_baixado
                        )}
                    </div>

                </div>

            </div>


            <label class="section-label">
                Saldo
            </label>

            <input
                type="text"
                value="${formatMinutes(
                    item.saldo
                )}"
                data-field="saldo"
                placeholder="Ex.: 05:12">


            <label class="section-label">
                Nota do supervisor
            </label>

            <textarea
                rows="2"
                data-field="nota_supervisor"
                placeholder="Ex.: ligada de máquina">${escapeHtml(
                    item.nota_supervisor || ""
                )}</textarea>


            ${
                item.observacao
                ?
                `
                <label class="section-label">
                    Observação do líder
                </label>

                <div class="leader-observation">
                    ${escapeHtml(
                        item.observacao
                    )}
                </div>
                `
                :
                ""
            }


            <div class="save-row">

                <button
                    class="save-btn"
                    onclick="salvarSupervisor(
                        ${item.id},
                        this
                    )">
                    Salvar alterações
                </button>


                <button
                    class="reset-btn"
                    onclick="carregarDados()">
                    Atualizar
                </button>

            </div>

        `;


        const inputs =
            card.querySelectorAll(
                'input[data-field="hora_boa"], input[data-field="reposicao"]'
            );


        inputs.forEach(
            input => {

                input.addEventListener(
                    "input",
                    () =>
                        atualizarTotalCard(
                            card
                        )
                );

            }
        );


        container.appendChild(
            card
        );

    }


    gerarFechamento();

}


/* =========================
   ATUALIZA TOTAL NO CARD
========================= */

function atualizarTotalCard(
    card
){

    const horaBoa =
        parseTime(
            card.querySelector(
                'input[data-field="hora_boa"]'
            ).value
        );


    const reposicao =
        parseTime(
            card.querySelector(
                'input[data-field="reposicao"]'
            ).value
        );


    const total =
        horaBoa +
        reposicao;


    const totalBox =
        card.querySelector(
            ".total-box"
        );


    const totalValue =
        card.querySelector(
            "[data-total]"
        );


    totalValue.textContent =
        formatMinutes(
            total
        );


    totalBox.classList.remove(
        "status-green",
        "status-yellow",
        "status-red"
    );


    totalBox.classList.add(
        getStatusClass(
            total
        )
    );

}


/* =========================
   SALVAR ALTERAÇÕES
========================= */

async function salvarSupervisor(
    id,
    button
){

    const card =
        button.closest(
            ".machine-card"
        );


    const horaBoa =
        parseTime(
            card.querySelector(
                'input[data-field="hora_boa"]'
            ).value
        );


    const reposicao =
        parseTime(
            card.querySelector(
                'input[data-field="reposicao"]'
            ).value
        );


    const total =
        horaBoa +
        reposicao;


    const saldo =
        parseTime(
            card.querySelector(
                'input[data-field="saldo"]'
            ).value
        );


    const nota =
        card.querySelector(
            'textarea[data-field="nota_supervisor"]'
        ).value.trim();


    button.disabled =
        true;


    button.textContent =
        "Salvando...";


    const {
        error
    } =
        await supabaseClient
            .from("apontamentos")
            .update({

                hora_boa:
                    horaBoa,

                reposicao:
                    reposicao,

                total_baixado:
                    total,

                saldo:
                    saldo,

                nota_supervisor:
                    nota ||
                    null

            })
            .eq(
                "id",
                id
            );


    button.disabled =
        false;


    button.textContent =
        "Salvar alterações";


    if(error){

        console.error(
            "Erro ao salvar:",
            error
        );


        mostrarToast(
            "Erro ao salvar alterações."
        );


        return;
    }


    mostrarToast(
        "Apontamento atualizado ✓"
    );


    await carregarDados();

}


/* =========================
   FECHAMENTO
========================= */

function gerarFechamento(){

    if(!dados.length){

        document
            .getElementById("fechamento")
            .classList.add("hidden");

        return;
    }


    const setor =
        document.getElementById(
            "setor"
        ).value;


    const linhas = [];


    linhas.push(
        `Horas baixadas setor ${setor}`
    );


    linhas.push("");


    for(
        const item of dados
    ){

        const maquina =
            formatMachine(
                item.maquina
            );


        const total =
            formatMinutes(
                item.total_baixado
            );


        let linha =
            `${maquina} - ${total}`;


        if(
            item.saldo !== null &&
            item.saldo !== undefined &&
            Number(item.saldo) !== 0
        ){

            linha +=
                ` (Saldo - ${formatMinutes(
                    item.saldo
                )})`;

        }


        if(
            item.nota_supervisor
        ){

            linha +=
                ` — ${item.nota_supervisor}`;

        }


        linhas.push(
            linha
        );

    }


    document.getElementById(
        "textoFechamento"
    ).value =
        linhas.join(
            "\n"
        );


    document
        .getElementById("fechamento")
        .classList.remove(
            "hidden"
        );

}


/* =========================
   DRIVE
========================= */

function renderDrive(){

    const container =
        document.getElementById(
            "listaDrive"
        );


    if(!dados.length){

        container.innerHTML = `

            <div class="empty">

                Nenhum apontamento encontrado.

                <br><br>

                <strong>
                    ${escapeHtml(
                        getContextoTexto()
                    )}
                </strong>

            </div>

        `;


        return;
    }


    container.innerHTML = "";


    for(
        const item of dados
    ){

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "drive-card";


        const maquina =
            formatMachine(
                item.maquina
            );


        const ocorrencias =
            item.ocorrencias ||
            [];


        let problemasHTML =
            "";


        if(
            !ocorrencias.length
        ){

            problemasHTML = `

                <div class="no-problems">
                    Nenhum problema registrado.
                </div>

            `;

        }else{

            problemasHTML =
                ocorrencias
                    .map(
                        oc => `

                            <div class="problem">

                                •
                                <span class="problem-category">
                                    ${escapeHtml(
                                        oc.categoria
                                    )}
                                </span>:

                                ${escapeHtml(
                                    oc.descricao
                                )}

                            </div>

                        `
                    )
                    .join("");

        }


        card.innerHTML = `

            <div class="drive-header">

                <div class="drive-title">
                    ${maquina}
                </div>

            </div>


            ${problemasHTML}


            ${
                ocorrencias.length
                ?
                `

                <button
                    class="copy-btn"
                    onclick="copiarProblemas(
                        ${item.maquina},
                        this
                    )">

                    Copiar problemas da
                    ${maquina}

                </button>

                `
                :
                ""
            }

        `;


        container.appendChild(
            card
        );

    }

}


/* =========================
   COPIAR PROBLEMAS
========================= */

async function copiarProblemas(
    maquinaNumero,
    button
){

    const numero =
        normalizarMaquina(
            maquinaNumero
        );


    const item =
        dados.find(
            x =>
                Number(
                    x.maquina
                ) ===
                Number(
                    numero
                )
        );


    if(!item){

        mostrarToast(
            "Máquina não encontrada."
        );

        return;
    }


    const ocorrencias =
        item.ocorrencias ||
        [];


    if(!ocorrencias.length){

        mostrarToast(
            "Não há problemas registrados."
        );

        return;
    }


    const maquina =
        formatMachine(
            numero
        );


    const linhas =
        [
            maquina,
            ""
        ];


    for(
        const oc of ocorrencias
    ){

        linhas.push(
            `• ${oc.categoria}: ${oc.descricao}`
        );

    }


    const texto =
        linhas.join(
            "\n"
        );


    try{

        await navigator.clipboard.writeText(
            texto
        );


        button.textContent =
            `Problemas da ${maquina} copiados ✓`;


        mostrarToast(
            `Problemas da ${maquina} copiados ✓`
        );


        setTimeout(
            () => {

                button.textContent =
                    `Copiar problemas da ${maquina}`;

            },
            1800
        );


    }catch(error){

        console.error(
            error
        );


        mostrarToast(
            "Não foi possível copiar."
        );

    }

}


/* =========================
   COPIAR FECHAMENTO
========================= */

async function copiarFechamento(){

    const texto =
        document.getElementById(
            "textoFechamento"
        ).value;


    try{

        await navigator.clipboard.writeText(
            texto
        );


        mostrarToast(
            "Horas copiadas ✓"
        );


    }catch(error){

        console.error(
            error
        );


        mostrarToast(
            "Não foi possível copiar."
        );

    }

}


/* =========================
   ABAS
========================= */

function mostrarAba(
    aba
){

    const horas =
        document.getElementById(
            "abaHoras"
        );


    const drive =
        document.getElementById(
            "abaDrive"
        );


    const tabHoras =
        document.getElementById(
            "tabHoras"
        );


    const tabDrive =
        document.getElementById(
            "tabDrive"
        );


    if(
        aba === "horas"
    ){

        horas.classList.remove(
            "hidden"
        );


        drive.classList.add(

        );


        tabHoras.classList.add(

    }else{

        drive.classList.remove(

        );


        tabHoras.classList.remove(

        );

        );

/* =========================
   STATUS
========================= */

function getStatusClass(
    totalMinutes
){

    const turno =
        document.getElementById(
            "turno"
        ).value;


    const target =
        shiftTargets[
            turno
        ];


    if(
        totalMinutes >=
        target
    ){

        return "status-green";

    }


    if(
        totalMinutes >=
        target - 48
    ){

        return "status-yellow";

    }


    return "status-red";

}


/* =========================
   TEMPO
========================= */

function parseTime(
    value
){

    if(
        !value
    ){

        return 0;

    }


    value =
        String(
            value
        )
        .trim()
        .replace(
            ",",
            ":"
        );


    if(
        value.includes(":")
    ){

        const parts =
            value.split(":");


        const horas =
            Number(
                parts[0]
            ) || 0;


        const minutos =
            Number(
                parts[1]
            ) || 0;


        return (
            horas * 60 +
            minutos
        );

    }


    const numero =
        Number(
            value
        );


    return Number.isFinite(
        numero
    )
        ? numero
        : 0;

}


function formatMinutes(
    minutes
){

    minutes =
        Number(
            minutes
        ) || 0;


    const negativo =
        minutes < 0;


    minutes =
        Math.abs(
            minutes
        );


    const horas =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    const resultado =
        `${String(
            horas
        ).padStart(2,"0")}:${String(
            mins
        ).padStart(2,"0")}`;


    return negativo
        ? `-${resultado}`
        : resultado;

}


/* =========================
   MÁQUINA
========================= */

function normalizarMaquina(
    valor
){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return null;

    }


    let texto =
        String(
            valor
        )
        .trim()
        .toUpperCase();


    /*
       Aceita:

       1
       01
       M1
       M01
       m01
    */

    texto =
        texto.replace(
            /^M/,
            ""
        );


    const numero =
        Number(
            texto
        );


    if(
        !Number.isInteger(
            numero
        ) ||
        numero <= 0
    ){

        return null;

    }


    return numero;

}


function formatMachine(
    valor
){

    const numero =
        normalizarMaquina(
            valor
        );


    if(
        numero === null
    ){

        return "M--";

    }


    return `M${String(
        numero
    ).padStart(2,"0")}`;

}


/* =========================
   CONTEXTO ATUAL
========================= */

function getContextoTexto(){

    const data =
        document.getElementById(
            "data"
        ).value;


    const turno =
        document.getElementById(
            "turno"
        ).value;


    const setor =
        document.getElementById(
            "setor"
        ).value;


    let dataFormatada =
        data;


    if(
        data &&
        data.includes("-")
    ){

        const partes =
            data.split("-");


        if(
            partes.length === 3
        ){

            dataFormatada =
                `${partes[2]}/${partes[1]}/${partes[0]}`;

        }

    }


    return `${dataFormatada} · ${turno} · Setor ${setor}`;

}


/* =========================
   UTILITÁRIOS
========================= */

function escapeHtml(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function mostrarToast(
    texto
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        texto;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2000
        );

}


/* =========================
   LOGOUT
========================= */

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href =
        "index.html";

}
