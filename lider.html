<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F2F2F7">
    <title>Controle de Produção</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root{
            --bg:#F2F2F7;
            --card:#FFFFFF;
            --text:#111111;
            --secondary:#6E6E73;
            --line:#E5E5EA;
            --blue:#007AFF;
            --green:#34C759;
            --red:#FF3B30;
            --yellow:#FFCC00;
            --shadow:0 2px 12px rgba(0,0,0,.06);
            --radius:18px;
        }

        *{
            box-sizing:border-box;
            -webkit-tap-highlight-color:transparent;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            margin:0;
            background:var(--bg);
            color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
                "SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
            min-height:100vh;
            padding-bottom:env(safe-area-inset-bottom);
        }

        button,
        input,
        select,
        textarea{
            font:inherit;
        }

        button{
            border:0;
            cursor:pointer;
        }

        .hidden{
            display:none !important;
        }

        /* HEADER */

        .app-header{
            position:sticky;
            top:0;
            z-index:50;
            padding:
                calc(12px + env(safe-area-inset-top))
                18px
                12px;
            background:rgba(242,242,247,.88);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            border-bottom:1px solid rgba(0,0,0,.05);
        }

        .header-inner{
            max-width:760px;
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
        }

        .app-title{
            font-size:17px;
            font-weight:700;
            letter-spacing:-.2px;
        }

        .app-subtitle{
            color:var(--secondary);
            font-size:12px;
            margin-top:2px;
        }

        .user-avatar{
            width:38px;
            height:38px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#111;
            color:#fff;
            font-size:13px;
            font-weight:700;
            flex-shrink:0;
        }

        /* MAIN */

        main{
            width:100%;
            max-width:760px;
            margin:0 auto;
            padding:18px;
        }

        /* CONTEXT */

        .leader-label{
            color:var(--secondary);
            font-size:12px;
            font-weight:600;
            text-transform:uppercase;
            letter-spacing:.5px;
        }

        .leader-name{
            font-size:22px;
            font-weight:700;
            letter-spacing:-.5px;
            margin-top:3px;
        }

        .context-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
            margin-top:18px;
        }

        .context-date{
            grid-column:1 / -1;
        }

        .field-card{
            background:var(--card);
            border-radius:var(--radius);
            padding:14px 15px;
            box-shadow:var(--shadow);
        }

        .field-label{
            color:var(--secondary);
            font-size:12px;
            font-weight:600;
            margin-bottom:7px;
        }

        .field-card input,
        .field-card select{
            width:100%;
            border:0;
            outline:0;
            background:transparent;
            color:var(--text);
            font-size:16px;
            font-weight:600;
            padding:0;
        }

        input[type="date"]{
            min-height:24px;
        }

        /* SECTION */

        .section{
            margin-top:22px;
        }

        .section-title{
            font-size:13px;
            font-weight:700;
            color:var(--secondary);
            text-transform:uppercase;
            letter-spacing:.5px;
            margin:0 4px 10px;
        }

        /* MACHINE GRID */

        .machine-grid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:10px;
        }

        .machine-button{
            min-height:62px;
            border-radius:17px;
            background:#fff;
            box-shadow:var(--shadow);
            color:var(--text);
            font-size:16px;
            font-weight:700;
            transition:.15s ease;
        }

        .machine-button:active{
            transform:scale(.96);
        }

        .machine-button.saved{
            background:var(--green);
            color:#fff;
        }

        /* MACHINE SCREEN */

        .machine-top{
            display:flex;
            align-items:center;
            gap:12px;
            margin-bottom:20px;
        }

        .back-button{
            width:42px;
            height:42px;
            border-radius:50%;
            background:#fff;
            box-shadow:var(--shadow);
            font-size:28px;
            line-height:1;
            color:#111;
        }

        .machine-title{
            font-size:26px;
            font-weight:750;
            letter-spacing:-.7px;
        }

        .machine-subtitle{
            color:var(--secondary);
            font-size:13px;
            margin-top:2px;
        }

        /* FORM */

        .form-card{
            background:#fff;
            border-radius:var(--radius);
            padding:18px;
            box-shadow:var(--shadow);
            margin-bottom:14px;
        }

        .form-title{
            font-size:16px;
            font-weight:700;
            margin-bottom:14px;
        }

        .hours-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
        }

        .input-group label{
            display:block;
            color:var(--secondary);
            font-size:12px;
            font-weight:600;
            margin:0 0 7px 2px;
        }

        .input-group input,
        .input-group textarea{
            width:100%;
            border:1px solid var(--line);
            background:#F8F8FA;
            border-radius:13px;
            outline:0;
            padding:12px;
            color:var(--text);
            font-size:17px;
            font-weight:600;
            transition:.15s ease;
        }

        .input-group input:focus,
        .input-group textarea:focus{
            border-color:var(--blue);
            background:#fff;
        }

        .input-group textarea{
            resize:vertical;
            min-height:95px;
            font-size:15px;
            font-weight:500;
        }

        .total-box{
            margin-top:14px;
            padding:15px;
            border-radius:15px;
            background:#F2F2F7;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
        }

        .total-label{
            color:var(--secondary);
            font-size:13px;
            font-weight:600;
        }

        .total-value{
            font-size:22px;
            font-weight:750;
            letter-spacing:-.4px;
        }

        /* PERFORMANCE */

        .performance{
            height:7px;
            border-radius:10px;
            margin-top:12px;
            background:#E5E5EA;
            overflow:hidden;
        }

        .performance-bar{
            height:100%;
            width:0;
            border-radius:10px;
            transition:.2s ease;
        }

        .status-green{
            background:var(--green);
        }

        .status-yellow{
            background:var(--yellow);
        }

        .status-red{
            background:var(--red);
        }

        /* SALDO */

        .saldo-row{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin-top:15px;
        }

        .saldo-row label{
            font-size:14px;
            font-weight:600;
        }

        .saldo-row input{
            width:120px;
            border:1px solid var(--line);
            background:#F8F8FA;
            border-radius:12px;
            padding:10px;
            text-align:center;
            outline:0;
            font-weight:600;
        }

        /* OCCURRENCES */

        .occurrence-list{
            display:flex;
            flex-direction:column;
            gap:8px;
            margin-bottom:12px;
        }

        .occurrence-item{
            background:#F2F2F7;
            border-radius:13px;
            padding:11px 12px;
            display:flex;
            align-items:flex-start;
            gap:10px;
        }

        .occurrence-content{
            flex:1;
            min-width:0;
        }

        .occurrence-type{
            font-size:12px;
            color:var(--secondary);
            font-weight:700;
            margin-bottom:3px;
        }

        .occurrence-description{
            font-size:14px;
            line-height:1.35;
            word-break:break-word;
        }

        .occurrence-actions{
            display:flex;
            gap:5px;
            flex-shrink:0;
        }

        .mini-button{
            width:32px;
            height:32px;
            border-radius:9px;
            background:#fff;
            color:#111;
            font-size:14px;
        }

        .mini-button.delete{
            color:var(--red);
        }

        .add-occurrence{
            width:100%;
            padding:13px;
            border-radius:13px;
            background:#F2F2F7;
            color:var(--blue);
            font-weight:700;
            font-size:15px;
        }

        /* OCCURRENCE EDITOR */

        .occurrence-editor{
            margin-top:12px;
            padding:14px;
            border-radius:15px;
            background:#F2F2F7;
        }

        .occurrence-editor select{
            width:100%;
            border:1px solid var(--line);
            border-radius:12px;
            background:#fff;
            padding:11px;
            outline:0;
            margin-bottom:9px;
        }

        .occurrence-editor textarea{
            width:100%;
            min-height:80px;
            resize:vertical;
            border:1px solid var(--line);
            border-radius:12px;
            background:#fff;
            padding:11px;
            outline:0;
        }

        .editor-actions{
            display:flex;
            gap:8px;
            margin-top:9px;
        }

        .editor-actions button{
            flex:1;
            padding:11px;
            border-radius:11px;
            font-weight:700;
        }

        .editor-cancel{
            background:#fff;
            color:#111;
        }

        .editor-save{
            background:var(--blue);
            color:#fff;
        }

        /* ACTIONS */

        .save-button{
            width:100%;
            min-height:54px;
            border-radius:16px;
            background:var(--green);
            color:#fff;
            font-size:16px;
            font-weight:750;
            box-shadow:0 5px 16px rgba(52,199,89,.20);
            margin-top:6px;
        }

        .save-button:active{
            transform:scale(.985);
        }

        .delete-machine{
            width:100%;
            margin-top:12px;
            padding:13px;
            border-radius:14px;
            background:transparent;
            color:var(--red);
            font-weight:650;
        }

        /* TOAST */

        .toast{
            position:fixed;
            left:50%;
            bottom:
                calc(22px + env(safe-area-inset-bottom));
            transform:translate(-50%,20px);
            background:rgba(20,20,20,.94);
            color:#fff;
            padding:12px 17px;
            border-radius:999px;
            font-size:14px;
            font-weight:600;
            z-index:100;
            opacity:0;
            pointer-events:none;
            transition:.22s ease;
            white-space:nowrap;
            max-width:calc(100vw - 30px);
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .toast.show{
            opacity:1;
            transform:translate(-50%,0);
        }

        /* LOADING */

        .loading{
            position:fixed;
            inset:0;
            background:rgba(242,242,247,.72);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:200;
        }

        .loading-box{
            background:#fff;
            padding:20px 24px;
            border-radius:18px;
            box-shadow:var(--shadow);
            font-size:15px;
            font-weight:600;
        }

        /* RESPONSIVE */

        @media(max-width:520px){
            main{
                padding:16px;
            }

            .machine-grid{
                grid-template-columns:repeat(4,1fr);
                gap:8px;
            }

            .machine-button{
                min-height:58px;
                font-size:15px;
            }
        }

        @media(max-width:350px){
            .machine-grid{
                grid-template-columns:repeat(3,1fr);
            }

            .hours-grid{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER PRINCIPAL -->
    <header class="app-header" id="mainHeader">
        <div class="header-inner">
            <div>
                <div class="app-title">CONTROLE DE PRODUÇÃO</div>
                <div class="app-subtitle">Setor de Injeção</div>
            </div>

            <div class="user-avatar" id="userAvatar">
                --

    <main>

        <!-- CONTEXTO -->
        <section id="contextSection">

            <div class="leader-label">LÍDER</div>

            <div class="context-grid">

                <div class="field-card">

                </div>

            <!-- MÁQUINAS -->
            <section class="section" id="machineListSection">

                <div class="section-title">
                    Máquinas
                </div>

                <div
                    class="machine-grid"
                    id="machineGrid"
                ></div>

            </section>

        </section>

        <!-- TELA DA MÁQUINA -->
        <section
            id="machineScreen"
            class="hidden"
        >

            <div class="machine-top">

                <button
                    class="back-button"
                    onclick="fecharTelaMaquina()"
                    aria-label="Voltar"
                >
                    ‹
                </button>

                <div>
                    <div
                        class="machine-title"
                        id="machineTitle"
                    >
                        M01
                    </div>

                    <div
                        class="machine-subtitle"
                        id="machineSubtitle"
                    >
                        Apontamento da máquina
                    </div>
                </div>

            </div>

            <!-- HORAS -->
            <div class="form-card">

                <div class="form-title">
                    Produção
                </div>

                <div class="hours-grid">

                    <div class="input-group">
                        <label for="goodHours">
                            Hora boa
                        </label>

                        <input
                            type="text"
                            id="goodHours"
                            inputmode="numeric"
                            placeholder="00:00"
                            maxlength="5"
                        >
                    </div>

                    <div class="input-group">
                        <label for="replacementHours">
                            Reposição
                        </label>

                        <input
                            type="text"
                            id="replacementHours"
                            inputmode="numeric"
                            placeholder="00:00"
                            maxlength="5"
                        >
                    </div>

                </div>

                <div class="total-box">

                    <div class="total-label">
                        Total baixado
                    </div>

                    <div
                        class="total-value"
                        id="totalHours"
                    >
                        00:00
                    </div>

                </div>

                <div class="performance">
                    <div
                        class="performance-bar"
                        id="performanceBar"
                    ></div>
                </div>

                <div class="saldo-row">

                    <label for="balance">
                        Saldo
                    </label>

                    <input
                        type="text"
                        id="balance"
                        inputmode="numeric"
                        placeholder="00:00"
                        maxlength="6"
                    >

                </div>

            </div>

            <!-- OCORRÊNCIAS -->
            <div class="form-card">

                <div class="form-title">
                    Ocorrências
                </div>

                <div
                    class="occurrence-list"
                    id="occurrenceList"
                ></div>

                <button
                    class="add-occurrence"
                    onclick="abrirEditorOcorrencia()"
                >
                    + Adicionar ocorrência
                </button>

                <div
                    class="occurrence-editor hidden"
                    id="occurrenceEditor"
                >

                    <select id="occurrenceType">

                        <option value="Mecânico">
                            Mecânico
                        </option>

                        <option value="Elétrico">
                            Elétrico
                        </option>

                        <option value="Matriz">
                            Matriz
                        </option>

                        <option value="Material">
                            Material
                        </option>

                        <option value="Processo">
                            Processo
                        </option>

                        <option value="Parada de máquina">
                            Parada de máquina
                        </option>

                        <option value="Setup">
                            Setup
                        </option>

                        <option value="Outro">
                            Outro
                        </option>

                    </select>

                    <textarea
                        id="occurrenceDescription"
                        placeholder="Descreva a ocorrência..."
                    ></textarea>

                    <div class="editor-actions">

                        <button
                            class="editor-cancel"
                            onclick="cancelarEditorOcorrencia()"
                        >
                            Cancelar
                        </button>

                        <button
                            class="editor-save"
                            onclick="salvarOcorrenciaLocal()"
                        >
                            Salvar
                        </button>

                    </div>

            </div>

            <!-- OBSERVAÇÃO -->
            <div class="form-card">

                <div class="form-title">
                    Observação
                </div>

                <div class="input-group">

                    <textarea
                        id="observation"
                        placeholder="Observação geral da máquina..."
                    ></textarea>

                </div>

            </div>

            <!-- AÇÕES -->
            <button
                class="save-button"
                onclick="salvarMaquina()"
            >
                Salvar máquina
            </button>

            <button
                class="delete-machine hidden"
                id="deleteMachineButton"
                onclick="excluirMaquina()"

                Excluir apontamento

        </section>

    </main>

    <!-- TOAST -->
    <div
        class="toast"
        id="toast"
    ></div>

    <!-- LOADING -->
    <div
        class="loading hidden"
        id="loading"
    >
        <div class="loading-box">
            Carregando...
        </div>
    </div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://icajmncojvidhrqlbevq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vQFsGutuZDHBruMghZkQYQ_BSwEBXFp";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ESTADO
========================================================= */

let currentUser = null;
let currentProfile = null;

let turnIdAtual = null;

let machineAtual = null;
let apontamentoAtual = null;

let ocorrenciasAtuais = [];

let occurrenceEditIndex = null;


/* =========================================================
   METAS
========================================================= */

const shiftTargets = {

    "1º turno":
        8 * 60 + 48,

    "2º turno":
        8 * 60 + 36,

    "3º turno":
        6 * 60 + 36

};


/* =========================================================
   ELEMENTOS
========================================================= */

const dateInput =
    document.getElementById("date");

const shiftInput =
    document.getElementById("shift");

const sectorInput =
    document.getElementById("sector");

const leaderName =
    document.getElementById("leaderName");

const userAvatar =
    document.getElementById("userAvatar");

const machineGrid =
    document.getElementById("machineGrid");

const machineListSection =
    document.getElementById("machineListSection");

const machineScreen =
    document.getElementById("machineScreen");

const mainHeader =
    document.getElementById("mainHeader");

const contextSection =
    document.getElementById("contextSection");

const machineTitle =
    document.getElementById("machineTitle");

const machineSubtitle =
    document.getElementById("machineSubtitle");

const goodHoursInput =
    document.getElementById("goodHours");

const replacementHoursInput =
    document.getElementById("replacementHours");

const totalHours =
    document.getElementById("totalHours");

const performanceBar =
    document.getElementById("performanceBar");

const balanceInput =
    document.getElementById("balance");

const occurrenceList =
    document.getElementById("occurrenceList");

const occurrenceEditor =

const occurrenceType =
    document.getElementById("occurrenceType");

const occurrenceDescription =

const observationInput =
    document.getElementById("observation");

const deleteMachineButton =
    document.getElementById("deleteMachineButton");


/* =========================================================
   UTILITÁRIOS
========================================================= */

function showLoading(show){

    document
        .getElementById("loading")
        .classList.toggle(
            "hidden",
            !show
        );

}


let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        }, 2400);

}


function formatMachine(value){

    const number =
        Number(value);

    if(
        !Number.isFinite(number)
    ){
        return String(value);
    }

    return "M" +
        String(number).padStart(2,"0");

}


function machineNumber(value){

    const match =
        String(value || "")
            .match(/^M(\d+)$/i);

    if(!match){
        return null;
    }

    const number =
        Number(match[1]);

    if(
        !Number.isInteger(number) ||
        number <= 0
    ){
        return null;
    }

    return number;
}


function normalizeMachine(value){

    if(
        typeof value === "number"
    ){
        return formatMachine(value);
    }

    const text =
        String(value || "")
            .trim()
            .toUpperCase();

    if(
        /^M\d+$/.test(text)
    ){
        const number =
            Number(text.substring(1));

        return formatMachine(number);
    }

    if(
        /^\d+$/.test(text)
    ){
        return formatMachine(
            Number(text)
        );
    }

    return text;
}


function parseMinutes(value){

    if(
        value === null ||
        value === undefined
    ){
        return 0;
    }

    const text =
        String(value)
            .trim();

    if(!text){
        return 0;
    }

    if(
        /^\d{1,3}:\d{2}$/.test(text)
    ){

        const parts =
            text.split(":");

        const hours =
            Number(parts[0]);

        const minutes =
            Number(parts[1]);

        if(
            !Number.isInteger(hours) ||
            !Number.isInteger(minutes) ||
            minutes > 59
        ){
            return 0;
        }

        return hours * 60 + minutes;
    }

    if(
        /^\d+$/.test(text)
    ){
        return Number(text);
    }

    return 0;
}


function minutesToHHMM(minutes){

    const total =
        Math.max(
            0,
            Math.round(
                Number(minutes) || 0
            )
        );

    const hours =
        Math.floor(total / 60);

    const mins =
        total % 60;

    return String(hours).padStart(2,"0") +
        ":" +
        String(mins).padStart(2,"0");
}


function getSectorMachines(sector){

    if(sector === "A"){

        return Array.from(
            {length:29},
            (_,index) =>
                index + 1
        );

    }

    if(sector === "B"){

        return Array.from(
            {length:22},
            (_,index) =>
                index + 30
        );

    }

    if(sector === "C"){

        return Array.from(
            {length:34},
            (_,index) =>
                index + 52
        );

    }

    return [];
}


function getStatusClass(totalMinutes){

    const shift =
        shiftInput.value;

    const target =
        shiftTargets[shift];

    if(
        totalMinutes >= target
    ){
        return "status-green";
    }

    if(
        totalMinutes >= target - 48
    ){
        return "status-yellow";
    }

    return "status-red";
}

/* =========================================================
   TURNO
========================================================= */

async function obterOuCriarTurno(){

    if(!currentUser){
        throw new Error(
            "Usuário não autenticado."
        );
    }

    const data =
        dateInput.value;

    const turno =
        shiftInput.value;

    const setor =
        sectorInput.value;

    if(
        !data ||
        !turno ||
        !setor
    ){
        throw new Error(
            "Preencha data, turno e setor."
        );
    }

    /* Primeiro tenta localizar */

    const {
        data: existing,
        error: findError
    } =
        await supabaseClient
            .from("turnos")
            .select("*")
            .eq("data", data)
            .eq("turno", turno)
            .eq("setor", setor)
            .eq("lider_id", currentUser.id)
            .maybeSingle();

    if(findError){
        console.error(findError);
        throw findError;
    }

    if(existing){

        turnIdAtual =
            existing.id;

        return existing;
    }


    /* Se não existe, cria */

    const {
        data: created,
        error: createError
    } =
        await supabaseClient
            .from("turnos")
            .insert({

                data:data,
                turno:turno,
                setor:setor,
                lider_id:currentUser.id

            })
            .select("*")
            .single();

    if(
        createError
    ){

        /*
         * 23505 = conflito de chave única.
         * Outro processo pode ter criado o turno
         * entre a consulta e o INSERT.
         */

        if(
            createError.code === "23505"
        ){

            const {
                data: retry,
                error: retryError
            } =
                await supabaseClient
                    .from("turnos")
                    .select("*")
                    .eq("data", data)
                    .eq("turno", turno)
                    .eq("setor", setor)
                    .eq("lider_id", currentUser.id)
                    .single();

            if(retryError){
                console.error(retryError);
                throw retryError;
            }

            turnIdAtual =
                retry.id;

            return retry;
        }

        console.error(createError);
        throw createError;
    }

    turnIdAtual =
        created.id;

    return created;
}

function editarOcorrencia(index){

        return;
    }

    occurrenceEditIndex =
        index;

    occurrenceType.value =
        item.tipo ||

function salvarOcorrenciaLocal(){

    const tipo =
        occurrenceType.value;

    const descricao =
        occurrenceDescription.value
            .trim();

    if(!descricao){

        showToast(
            "Descreva a ocorrência."
        );

        return;
    }


    const item = {

        tipo:tipo,
        descricao:descricao

    };


    if(
        occurrenceEditIndex === null
    ){

        ocorrenciasAtuais.push(
            item
        );

    }else{

        const existing =
            ocorrenciasAtuais[
                occurrenceEditIndex
            ];

        /*
         * Preserva o ID caso já exista no banco.
         */

        if(existing && existing.id){

            item.id =
                existing.id;

        }

        ocorrenciasAtuais[
            occurrenceEditIndex
        ] = item;

    }


    occurrenceEditIndex =
        null;

    occurrenceDescription.value =
        "";

    occurrenceEditor.classList.add(
        "hidden"
    );

    renderOccurrences();

    showToast(
        "Ocorrência adicionada."
    );
}


function removerOcorrencia(index){

    if(
        !confirm(
            "Excluir esta ocorrência?"
        )
    ){
        return;
    }

    ocorrenciasAtuais.splice(
        index,
        1
    );

    renderOccurrences();
}

   HORAS
========================================================= */

function atualizarTotal(){

    const good =
        parseMinutes(
            goodHoursInput.value
        );

    const replacement =
        parseMinutes(
            replacementHoursInput.value
        );

    const total =
        good + replacement;

    totalHours.textContent =
        minutesToHHMM(total);


    const shift =
        shiftInput.value;

    const target =
        shiftTargets[shift] || 0;

    /*
     * A barra representa apenas a proporção
     * do total baixado em relação à meta.
     */

    let percent =
        target > 0
            ? (total / target) * 100
            : 0;

    percent =
        Math.min(
            100,
            Math.max(
                0,
                percent
            )
        );

    performanceBar.style.width =
        `${percent}%`;

    performanceBar.className =
        "performance-bar " +
        getStatusClass(total);
}


/* =========================================================
   SALVAR MÁQUINA
========================================================= */

async function salvarMaquina(){

    if(!machineAtual){

        showToast(
            "Nenhuma máquina selecionada."
        );

        return;
    }


    showLoading(true);


    try{

        /*
         * Garante que o turno exista.
         */

        const turno =
            await obterOuCriarTurno();

        if(!turno || !turno.id){

            throw new Error(
                "Não foi possível localizar o turno."
            );

        }


        const horasBoas =
            minutesToHHMM(
                parseMinutes(
                    goodHoursInput.value
                )
            );

        const horasReposicao =
            minutesToHHMM(
                parseMinutes(
                    replacementHoursInput.value
                )
            );

        const saldo =
            balanceInput.value
                .trim();

        const observacao =
            observationInput.value
                .trim();


        /*
         * CORREÇÃO PRINCIPAL:
         *
         * O banco/RPC espera INTEGER em p_maquina.
         *
         * A interface usa M02, M07 etc.
         * Aqui convertemos M02 -> 2.
         */

        const maquinaNumero =
            Number(
                machineAtual.replace(
                    "M",
                    ""
                )
            );


        if(
            !Number.isInteger(
                maquinaNumero
            ) ||
            maquinaNumero <= 0
        ){

            showToast(
                "Máquina inválida."
            );

            return;
        }


        /*
         * Salva/atualiza o apontamento
         * através da função do Supabase.
         */

        const {
            data,
            error
        } =
            await supabaseClient
                .rpc(
                    "salvar_apontamento_lider",
                    {

                        p_turno_id:
                            turno.id,

                        p_maquina:
                            maquinaNumero,

                        p_horas_boas:
                            horasBoas,

                        p_horas_reposicao:
                            horasReposicao,

                        p_saldo:
                            saldo || null,

                        p_observacao:
                            observacao || null

                    }
                );


        if(error){

            console.error(
                "Erro RPC:",
                error
            );

            throw error;
        }


        /*
         * A RPC pode retornar o ID do apontamento.
         * Caso retorne objeto/array, tentamos aproveitar.
         */

        let apontamentoId =
            null;


        if(
            Array.isArray(data)
        ){

            if(data[0]){

                apontamentoId =
                    data[0].id ||
                    data[0].apontamento_id ||
                    null;

            }

        }else if(
            data &&
            typeof data === "object"
        ){

            apontamentoId =
                data.id ||
                data.apontamento_id ||
                null;

        }else if(
            typeof data === "number"
        ){

            apontamentoId =
                data;

        }


        /*
         * Se a RPC não retornar o ID,
         * buscamos o apontamento pelo turno
         * e máquina.
         */

        if(!apontamentoId){

            const {
                data: saved,
                error: savedError
            } =
                await supabaseClient
                    .from("apontamentos")
                    .select("*")
                    .eq(
                        "turno_id",
                        turno.id
                    )
                    .eq(
                        "maquina",
                        maquinaNumero
                    )
                    .single();

            if(savedError){

                console.error(
                    savedError
                );

                throw savedError;

            }

            apontamentoId =
                saved.id;

            apontamentoAtual =
                saved;

        }


        /*
         * Salva ocorrências.
         *
         * Primeiro removemos as antigas.
         * Depois inserimos a lista atual.
         *
         * Isso mantém o editor simples:
         * o estado da tela vira o estado do banco.
         */

        if(apontamentoId){

            const {
                error: deleteOccurrencesError
            } =
                await supabaseClient
                    .from("ocorrencias")
                    .delete()
                    .eq(
                        "apontamento_id",
                        apontamentoId
                    );

            if(
                deleteOccurrencesError
            ){

                console.error(
                    deleteOccurrencesError
                );

                throw deleteOccurrencesError;

            }


            if(
                ocorrenciasAtuais.length
            ){

                const rows =
                    ocorrenciasAtuais
                        .map(
                            item => ({

                                apontamento_id:
                                    apontamentoId,

                                tipo:
                                    item.tipo ||
                                    "Outro",

                                descricao:
                                    item.descricao ||
                                    ""

                            })
                        )
                        .filter(
                            item =>
                                item.descricao
                                    .trim()
                                    .length > 0
                        );


                if(rows.length){

                    const {
                        error:
                            insertOccurrencesError
                    } =
                        await supabaseClient
                            .from("ocorrencias")
                            .insert(rows);


                    if(
                        insertOccurrencesError
                    ){

                        console.error(
                            insertOccurrencesError
                        );

                        throw insertOccurrencesError;

                    }

                }

            }

        }


        /*
         * Recarrega o apontamento salvo.
         */

        const {
            data: finalData,
            error: finalError
        } =
            await supabaseClient
                .from("apontamentos")
                .select("*")
                .eq(
                    "turno_id",
                    turno.id
                )
                .eq(
                    "maquina",
                    maquinaNumero
                )
                .single();


        if(!finalError){

            apontamentoAtual =
                finalData;

        }


        showToast(
            `${machineAtual} salvo ✓`
        );


        /*
         * Atualiza o grid antes de voltar.
         */

        await renderMachineGrid();

        fecharTelaMaquina();


    }catch(error){

        console.error(
            "Erro ao salvar:",
            error
        );

        showToast(
            "Não foi possível salvar. " +
            (
                error.message ||
                "Erro desconhecido."
            )
        );

    }finally{

        showLoading(false);

    }

}


/* =========================================================
   EXCLUIR MÁQUINA
========================================================= */

async function excluirMaquina(){

    if(
        !apontamentoAtual ||
        !apontamentoAtual.id
    ){

        showToast(
            "Não há apontamento para excluir."
        );

        return;
    }


    if(
        !confirm(
            `Excluir o apontamento da ${machineAtual}?`
        )
    ){
        return;
    }


    showLoading(true);


    try{

        /*
         * Primeiro exclui ocorrências.
         */

        const {
            error:
                occurrenceError
        } =
            await supabaseClient
                .from("ocorrencias")
                .delete()
                .eq(
                    "apontamento_id",
                    apontamentoAtual.id
                );


        if(occurrenceError){

            throw occurrenceError;

        }


        /*
         * Depois exclui o apontamento.
         */

        const {
            error:
                deleteError
        } =
            await supabaseClient
                .from("apontamentos")
                .delete()
                .eq(
                    "id",
                    apontamentoAtual.id
                );


        if(deleteError){

            throw deleteError;

        }


        showToast(
            `${machineAtual} excluído ✓`
        );


        await renderMachineGrid();

        fecharTelaMaquina();


    }catch(error){

        console.error(error);

        showToast(
            "Não foi possível excluir. " +
            (
                error.message ||
                "Erro desconhecido."
            )
        );

    }finally{

        showLoading(false);

    }

}

        }

        currentUser =
            session.user;

    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

async function init(){

    showLoading(true);

    try{

        const {
            data: {
                session
            }
        } =
            await supabaseClient
                .auth
                .getSession();


        if(
            !session ||
            !session.user
        ){

            window.location.href =
                "index.html";

            return;
        }


        currentUser =
            session.user;


        await carregarPerfil();


        /*
         * Data atual como padrão.
         */

        if(!dateInput.value){

            dateInput.value =
                todayLocal();

        }


        /*
         * Padrões iniciais.
         */

        if(!shiftInput.value){

            shiftInput.value =
                "1º turno";

        }

        if(!sectorInput.value){

            sectorInput.value =
                "A";

        }


        await carregarDados();


    }catch(error){

        console.error(
            "Erro na inicialização:",
            error
        );

        showToast(
            error.message ||
            "Não foi possível carregar o sistema."
        );

    }finally{

        showLoading(false);

    }

}


init();

</script>
