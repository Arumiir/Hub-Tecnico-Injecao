<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Controle de Produção — Líder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#f2f2f7;
    --card:#ffffff;
    --text:#111111;
    --muted:#6e6e73;
    --line:#e5e5ea;
    --blue:#007aff;
    --green:#34c759;
    --red:#ff3b30;
    --yellow:#ffcc00;
    --shadow:0 8px 30px rgba(0,0,0,.06);
    --radius:20px;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:20;
    padding:
        calc(14px + env(safe-area-inset-top))
        18px
        14px;
    background:rgba(242,242,247,.88);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(0,0,0,.06);
}

.header-inner{
    max-width:760px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
}

.brand-title{
    font-size:18px;
    font-weight:800;
    letter-spacing:-.4px;
}

.brand-subtitle{
    margin-top:2px;
    color:var(--muted);
    font-size:13px;
}

.user-badge{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;
    flex-shrink:0;
}

/* MAIN */

main{
    width:min(760px,100%);
    margin:auto;
    padding:
        22px
        16px
        calc(32px + env(safe-area-inset-bottom));
}

/* LEADER */

.leader-block{
    margin-bottom:20px;
}

.eyebrow{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.08em;
}

.leader-name{
    margin-top:4px;
    font-size:25px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.7px;
}

/* CONTEXT */

.context-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
}

.context-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:18px;
}

.context-date{
    grid-column:1 / -1;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field label{
    font-size:12px;
    color:var(--muted);
    font-weight:700;
}

input,
select,
textarea{
    width:100%;
    border:1px solid var(--line);
    background:#f8f8fa;
    color:var(--text);
    border-radius:14px;
    outline:none;
    transition:.18s ease;
}

input,
select{
    min-height:48px;
    padding:0 13px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:rgba(0,122,255,.45);
    box-shadow:0 0 0 4px rgba(0,122,255,.10);
    background:white;
}

/* ACCESS */

.access-row{
    margin-top:14px;
}

.access-btn{
    width:100%;
    min-height:44px;
    border:0;
    border-radius:14px;
    background:#e9e9ee;
    color:#111;
    font-weight:700;
}

/* SECTION */

.section-title{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:12px;
    margin:24px 2px 12px;
}

.section-title h2{
    margin:0;
    font-size:20px;
    letter-spacing:-.4px;
}

.section-title p{
    margin:0;
    color:var(--muted);
    font-size:13px;
}

/* MACHINE GRID */

.machine-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.machine-btn{
    min-height:64px;
    border:0;
    border-radius:17px;
    background:white;
    color:#111;
    box-shadow:0 4px 18px rgba(0,0,0,.055);
    font-weight:800;
    font-size:16px;
    transition:.16s ease;
    position:relative;
}

.machine-btn:active{
    transform:scale(.96);
}

.machine-btn.saved{
    background:#e9f9ed;
    color:#16803a;
    box-shadow:inset 0 0 0 1px rgba(52,199,89,.22);
}

.machine-btn.saved::after{
    content:"✓";
    position:absolute;
    top:6px;
    right:8px;
    font-size:12px;
    font-weight:900;
}

/* MACHINE SCREEN */

.machine-screen{
    animation:slideIn .2s ease;
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.machine-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
}

.back-btn{
    width:44px;
    height:44px;
    border:0;
    border-radius:14px;
    background:white;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
    font-size:25px;
    line-height:1;
}

.machine-heading{
    flex:1;
}

.machine-heading .small{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
}

.machine-heading h2{
    margin:2px 0 0;
    font-size:25px;
    letter-spacing:-.6px;
}

/* FORM CARDS */

.form-card{
    background:white;
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
}

.form-card h3{
    margin:0 0 14px;
    font-size:17px;
    letter-spacing:-.2px;
}

.hours-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.hours-total{
    margin-top:12px;
    padding:14px;
    border-radius:14px;
    background:#f5f5f7;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.hours-total span:first-child{
    color:var(--muted);
    font-size:13px;
    font-weight:600;
}

.hours-total strong{
    font-size:18px;
}

/* STATUS */

.performance-status{
    margin-top:10px;
    min-height:8px;
    border-radius:99px;
    background:#e5e5ea;
    transition:.2s ease;
}

.performance-status.status-red{
    background:var(--red);
}

.performance-status.status-yellow{
    background:var(--yellow);
}

.performance-status.status-green{
    background:var(--green);
}

/* OCCURRENCES */

.occurrences-list{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-bottom:12px;
}

.occurrence-item{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:10px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#fafafa;
}

.occurrence-type{
    padding:6px 9px;
    border-radius:9px;
    background:#eeeeF3;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
}

.occurrence-description{
    font-size:14px;
    line-height:1.3;
    overflow-wrap:anywhere;
}

.occurrence-actions{
    display:flex;
    gap:5px;
}

.icon-btn{
    width:32px;
    height:32px;
    border:0;
    border-radius:9px;
    background:#ededf2;
    font-size:14px;
}

.icon-btn.delete{
    color:var(--red);
}

.add-occurrence{
    width:100%;
    min-height:46px;
    border:1px dashed #b8b8bf;
    border-radius:14px;
    background:#fafafa;
    font-weight:700;
    color:#333;
}

/* OCCURRENCE EDITOR */

.occurrence-editor{
    margin-top:12px;
    padding:14px;
    background:#f5f5f7;
    border-radius:15px;
}

.occurrence-editor-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
}

.editor-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.editor-actions button{
    flex:1;
    min-height:44px;
    border:0;
    border-radius:13px;
    font-weight:700;
}

.cancel-btn{
    background:#e5e5ea;
}

.confirm-btn{
    background:#007aff;
    color:white;
}

/* OBSERVATION */

textarea{
    min-height:110px;
    padding:13px;
    resize:vertical;
    line-height:1.4;
}

/* SAVE */

.save-btn{
    width:100%;
    min-height:54px;
    border:0;
    border-radius:17px;
    background:var(--green);
    color:white;
    font-size:16px;
    font-weight:800;
    box-shadow:0 7px 20px rgba(52,199,89,.22);
}

.save-btn:active{
    transform:scale(.98);
}

.delete-machine-btn{
    width:100%;
    min-height:46px;
    border:0;
    border-radius:15px;
    background:#ffeceb;
    color:var(--red);
    font-weight:700;
    margin-top:10px;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:calc(22px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);
    z-index:100;
    padding:12px 17px;
    border-radius:14px;
    background:rgba(20,20,20,.92);
    color:white;
    font-size:14px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:.2s ease;
    max-width:calc(100% - 32px);
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* LOADING */

.loading{
    padding:30px 10px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:80;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.35);
    padding:16px;
}

.modal-card{
    width:min(520px,100%);
    background:white;
    border-radius:24px;
    padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.22);
}

.modal-card h3{
    margin:0 0 15px;
    font-size:20px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.modal-actions button{
    flex:1;
    min-height:46px;
    border:0;
    border-radius:14px;
    font-weight:700;
}

.modal-cancel{
    background:#e5e5ea;
}

.modal-save{
    background:#007aff;
    color:white;
}

/* SMALL DEVICES */

@media(max-width:380px){
    main{
        padding-left:12px;
        padding-right:12px;
    }

    .machine-grid{
        gap:8px;
    }

    .machine-btn{
        min-height:58px;
    }

    .context-card,
    .form-card{
        padding:15px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div>
            <div class="brand-title">CONTROLE DE PRODUÇÃO</div>
            <div class="brand-subtitle">Setor de Injeção</div>
        </div>

        <div id="userInitials" class="user-badge">--</div>

</header>

<main>

    <section class="leader-block">
        <div class="eyebrow">Líder</div>
        <div id="leaderName" class="leader-name">Carregando...</div>
    </section>

    <section class="context-card">

        <div class="context-grid">

            <div class="field context-date">
                <label for="date">Data</label>
                <input type="date" id="date">
            </div>

            <div class="field">
                <label for="shift">Turno</label>
                <select id="shift">

            </div>

            <div class="field">
                <label for="sector">Setor</label>

        <div id="accessRow" class="access-row hidden">

    </section>

    <section id="machineListSection">

        <div class="section-title">

                <h2>Máquinas</h2>

            </div>
        </div>

        <div id="machineGrid" class="machine-grid"></div>

    </section>

    <section id="machineScreen" class="machine-screen hidden">

            </button>

            <div class="machine-heading">
                <div class="small">Apontamento</div>
                <h2 id="machineTitle">M01</h2>
            </div>

        </div>

        <div class="form-card">

            <h3>Horas</h3>

            <div class="hours-grid">

                <div class="field">
                    <label for="horaBoa">Hora boa</label>
                    <input
                        type="text"
                        id="horaBoa"
                        inputmode="numeric"
                        placeholder="00:00"
                        maxlength="5"
                    >
                </div>

                <div class="field">
                    <label for="reposicao">Reposição</label>
                    <input
                        type="text"
                        id="reposicao"
                        inputmode="numeric"
                        placeholder="00:00"
                        maxlength="5"
                    >
                </div>

            </div>

            <div class="hours-total">
                <span>Total baixado</span>
                <strong id="totalBaixado">00:00</strong>
            </div>

            <div id="performanceStatus" class="performance-status"></div>

        </div>

        <div class="form-card">

                    id="saldoValue"
                    inputmode="numeric"
                    placeholder="00:00"

            </div>

        </div>

        <div class="form-card">

            <h3>Ocorrências</h3>

            <div id="occurrencesList" class="occurrences-list"></div>

            <button
                id="addOccurrenceBtn"
                class="add-occurrence"

            >
                + Adicionar ocorrência
            </button>

            <div id="occurrenceEditor" class="occurrence-editor hidden">

                <div class="occurrence-editor-grid">

                    <div class="field">
                        <label for="occurrenceType">Tipo</label>

                        <select id="occurrenceType">
                            <option value="Mecânico">Mecânico</option>
                            <option value="Elétrico">Elétrico</option>
                            <option value="Matriz">Matriz</option>
                            <option value="Material">Material</option>
                            <option value="Processo">Processo</option>
                            <option value="Parada de máquina">Parada de máquina</option>
                            <option value="Setup">Setup</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="occurrenceDescription">Descrição</label>

                        <textarea
                            id="occurrenceDescription"
                            placeholder="Descreva a ocorrência..."
                            style="min-height:90px;"
                        ></textarea>
                    </div>

                </div>

                <div class="editor-actions">

                    <button
                        class="cancel-btn"
                        onclick="cancelarEditorOcorrencia()"
                    >
                        Cancelar
                    </button>

                    <button

                        onclick="salvarOcorrenciaLocal()"

                        Salvar ocorrência

        <div class="form-card">

            <h3>Observação geral</h3>

        <button
            id="saveMachineBtn"
            class="save-btn"
            onclick="salvarMaquina()"
        >
            Salvar máquina

        <button

</main>

<div id="toast" class="toast"></div>

<div id="confirmModal" class="modal hidden">

    <div class="modal-card">

        <h3 id="confirmTitle">Confirmar</h3>

        <div id="confirmMessage" style="color:#6e6e73;line-height:1.45;">

            <button

                Cancelar
            </button>

            <button
                id="confirmActionBtn"
                class="modal-save"

                Confirmar
            </button>

        </div>

    </div>

</div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://icajmncojvidhrqlbevq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vQFsGutuZDHBruMghZkQYQ_BSwEBXFp";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ESTADO
========================================================= */

let currentUser = null;
let currentProfile = null;

let machineAtual = null;

let turnIdAtual = null;

let apontamentoAtual = null;

let ocorrencias = [];

let occurrenceEditingIndex = null;

let confirmCallback = null;


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const sectorMachines = {
    A: {
        start: 1,
        end: 29
    },

    B: {
        start: 30,
        end: 51
    },

    C: {
        start: 52,
        end: 85
    }
};


const shiftTargets = {
    "1º turno": 8 * 60 + 48,
    "2º turno": 8 * 60 + 36,
    "3º turno": 6 * 60 + 36
};


/* =========================================================
   ELEMENTOS
========================================================= */

const dateInput =
    document.getElementById("date");

const shiftInput =
    document.getElementById("shift");

const sectorInput =
    document.getElementById("sector");

const machineGrid =
    document.getElementById("machineGrid");

const machineListSection =
    document.getElementById("machineListSection");

const machineScreen =
    document.getElementById("machineScreen");

const machineTitle =
    document.getElementById("machineTitle");

const horaBoaInput =
    document.getElementById("horaBoa");

const reposicaoInput =
    document.getElementById("reposicao");

const totalBaixadoElement =
    document.getElementById("totalBaixado");

const performanceStatus =
    document.getElementById("performanceStatus");

const saldoInput =
    document.getElementById("saldo");

const saldoInputWrapper =
    document.getElementById("saldoInputWrapper");

const saldoValueInput =
    document.getElementById("saldoValue");

const occurrencesList =
    document.getElementById("occurrencesList");

const occurrenceEditor =
    document.getElementById("occurrenceEditor");

const occurrenceType =
    document.getElementById("occurrenceType");

const occurrenceDescription =
    document.getElementById("occurrenceDescription");

const observationInput =
    document.getElementById("observation");

const deleteMachineBtn =
    document.getElementById("deleteMachineBtn");


/* =========================================================
   UTILITÁRIOS
========================================================= */

function pad(value){
    return String(value).padStart(2,"0");
}


function machineCode(number){
    return `M${pad(number)}`;
}


function getInitials(name){

    if(!name){
        return "--";
    }

    const parts =
        name
            .trim()
            .split(/\s+/)
            .filter(Boolean);

    if(parts.length === 1){
        return parts[0]
            .substring(0,2)
            .toUpperCase();
    }

    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();
}


function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
        setTimeout(() => {
            toast.classList.remove("show");
        }, 2400);
}


function normalizeMachine(value){

    if(!value){
        return "";
    }

    const text =
        String(value)
            .trim()
            .toUpperCase();

    if(/^M\d+$/.test(text)){
        return text;
    }

    if(/^\d+$/.test(text)){
        return machineCode(Number(text));
    }

    return text;
}


/* =========================================================
   HORAS
========================================================= */

function timeToMinutes(value){

    if(value === null || value === undefined){
        return 0;
    }

    const text =
        String(value).trim();

    if(!text){
        return 0;
    }

    const match =
        text.match(/^(\d{1,3}):([0-5]\d)$/);

    if(!match){
        return 0;
    }

    return (
        Number(match[1]) * 60 +
        Number(match[2])
    );
}


function minutesToTime(total){

    total =
        Math.max(
            0,
            Math.round(Number(total) || 0)
        );

    const hours =
        Math.floor(total / 60);

    const minutes =
        total % 60;

    return `${pad(hours)}:${pad(minutes)}`;
}


function normalizeTimeInput(value){

    let text =
        String(value || "")
            .replace(/\D/g,"")
            .slice(0,4);

    if(!text){
        return "";
    }

    if(text.length <= 2){
        return text;
    }

    const hours =
        text.slice(0,-2);

    const minutes =
        text.slice(-2);

    return `${hours}:${minutes}`;
}


function formatTimeField(input){

    const formatted =
        normalizeTimeInput(input.value);

    input.value = formatted;
}


function calculateTotal(){

    const good =
        timeToMinutes(horaBoaInput.value);

    const replacement =
        timeToMinutes(reposicaoInput.value);

    return good + replacement;
}


function updateTotal(){

    const total =
        calculateTotal();

    totalBaixadoElement.textContent =
        minutesToTime(total);

    performanceStatus.className =
        "performance-status " +
        getStatusClass(total);
}


function getStatusClass(totalMinutes){

    const shift =
        shiftInput.value;

    const target =
        shiftTargets[shift];

    if(totalMinutes >= target){
        return "status-green";
    }

    if(totalMinutes >= target - 48){
        return "status-yellow";
    }

    return "status-red";
}

========================================================= */

async function carregarPerfil(){

    const {
        data,
        error
    } = await supabaseClient
        .from("usuarios")
        .select(
            "id,nome,usuario,perfil,ativo,admin"
        )
        .eq("id", currentUser.id)
        .maybeSingle();

    if(error){
        throw error;
    }

    if(
        !data ||
        !data.ativo ||
        data.perfil !== "lider"
    ){
        window.location.href = "index.html";
        return false;
    }

    currentProfile = data;

    document.getElementById("leaderName")
        .textContent = data.nome;

    document.getElementById("userInitials")
        .textContent = getInitials(data.nome);

    if(data.admin === true){
        document
            .getElementById("accessRow")
            .classList.remove("hidden");
    }

    return true;
}

/* =========================================================
   TURNOS
========================================================= */

async function carregarTurno(){

    if(!currentUser){
        return null;
    }

    const data =
        dateInput.value;

    const turno =
        shiftInput.value;

    const setor =
        sectorInput.value;

    const {
        data: turnos,
        error
    } = await supabaseClient
        .from("turnos")
        .select("*")
        .eq("data", data)
        .eq("turno", turno)
        .eq("setor", setor)
        .eq("lider_id", currentUser.id)
        .limit(1);

    if(error){
        throw error;
    }

    if(turnos && turnos.length){
        return turnos[0];
    }

    return null;
}


/* =========================================================
   CARREGAMENTO DOS DADOS
========================================================= */

async function carregarDados(){

    machineAtual = null;
    apontamentoAtual = null;
    ocorrencias = [];

    fecharTelaMaquina();

    renderMachineGrid([]);

    const turno =
        await carregarTurno();

    if(!turno){
        turnIdAtual = null;
        renderMachineGrid([]);
        return;
    }

    turnIdAtual = turno.id;

    const {
        data,
        error
    } = await supabaseClient
        .from("apontamentos")
        .select(`
            *,
            ocorrencias (
                id,
                tipo,
                descricao,
                criado_em
            )
        `)
        .eq("turno_id", turno.id);

    if(error){
        throw error;
    }

    renderMachineGrid(data || []);
}


/* =========================================================
   GRID
========================================================= */

function renderMachineGrid(records){

    machineGrid.innerHTML = "";

    const setor =
        sectorInput.value;

    const range =
        sectorMachines[setor];

    const map =
        new Map();

    (records || []).forEach(record => {

        const code =
            normalizeMachine(record.maquina);

        if(code){
            map.set(code, record);
        }
    });

    for(
        let number = range.start;
        number <= range.end;
        number++
    ){

        const code =
            machineCode(number);

        const button =
            document.createElement("button");

        button.type = "button";
        button.className = "machine-btn";
        button.textContent = code;

        if(map.has(code)){
            button.classList.add("saved");
        }

        button.addEventListener(
            "click",
            () => abrirMaquina(code, map.get(code) || null)
        );

        machineGrid.appendChild(button);
    }
}


/* =========================================================
   ABRIR MÁQUINA
========================================================= */

function abrirMaquina(machine, record = null){

    machineAtual =
        normalizeMachine(machine);

    apontamentoAtual =
        record || null;

    ocorrencias =
        record && Array.isArray(record.ocorrencias)
            ? record.ocorrencias.map(item => ({
                id: item.id ?? null,
                tipo: item.tipo || "Outro",
                descricao: item.descricao || ""
            }))
            : [];

    machineTitle.textContent =
        machineAtual;

    machineListSection.classList.add("hidden");

    machineScreen.classList.remove("hidden");

    occurrenceEditor.classList.add("hidden");

    occurrenceEditingIndex = null;

    carregarFormulario(record);

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   FECHAR MÁQUINA
========================================================= */

function fecharTelaMaquina(){

    machineScreen.classList.add("hidden");

    machineListSection.classList.remove("hidden");

    machineAtual = null;

    apontamentoAtual = null;

    occurrenceEditingIndex = null;

    occurrenceEditor.classList.add("hidden");
}


/* =========================================================
   FORMULÁRIO
========================================================= */

function carregarFormulario(record){

    if(!record){

        horaBoaInput.value = "";

        reposicaoInput.value = "";

        saldoInput.value = "";

        saldoValueInput.value = "";

        saldoInputWrapper.classList.add("hidden");

        observationInput.value = "";

        deleteMachineBtn.classList.add("hidden");

    }else{

        horaBoaInput.value =
            record.hora_boa
                ? minutesToTime(
                    timeToMinutes(record.hora_boa)
                )
                : "";

        reposicaoInput.value =
            record.reposicao
                ? minutesToTime(
                    timeToMinutes(record.reposicao)
                )
                : "";

        if(record.saldo){

            saldoInput.value =
                "__CUSTOM__";

            saldoValueInput.value =
                minutesToTime(
                    timeToMinutes(record.saldo)
                );

            saldoInputWrapper.classList.remove("hidden");

        }else{

            saldoInput.value =
                "00:00";

            saldoValueInput.value = "";

            saldoInputWrapper.classList.add("hidden");
        }

        observationInput.value =
            record.observacao || "";

        deleteMachineBtn.classList.remove("hidden");
    }

    updateTotal();

    renderOccurrences();
}

/* =========================================================
   OCORRÊNCIAS
========================================================= */

function abrirEditorOcorrencia(index = null){

    occurrenceEditingIndex =
        index;

    if(index === null){

        occurrenceType.value =
            "Mecânico";

        occurrenceDescription.value =
            "";

    }else{

        const item =
            ocorrencias[index];

        occurrenceType.value =
            item.tipo || "Outro";

        occurrenceDescription.value =
            item.descricao || "";
    }

    occurrenceEditor.classList.remove("hidden");

    occurrenceDescription.focus();
}


function cancelarEditorOcorrencia(){

    occurrenceEditingIndex = null;

    occurrenceEditor.classList.add("hidden");

    occurrenceType.value =
        "Mecânico";

    occurrenceDescription.value =
        "";
}


function salvarOcorrenciaLocal(){

    const tipo =
        occurrenceType.value;

    const descricao =
        occurrenceDescription.value.trim();

    if(!descricao){

        showToast(
            "Informe a descrição da ocorrência."
        );

        occurrenceDescription.focus();

        return;
    }

    const item = {
        id:null,
        tipo,
        descricao
    };

    if(
        occurrenceEditingIndex === null
    ){

        ocorrencias.push(item);

    }else{

        const old =
            ocorrencias[
                occurrenceEditingIndex
            ];

        ocorrencias[
            occurrenceEditingIndex
        ] = {
            id:old.id || null,
            tipo,
            descricao
        };
    }

    cancelarEditorOcorrencia();

    renderOccurrences();
}


function editarOcorrencia(index){
    abrirEditorOcorrencia(index);
}


function removerOcorrencia(index){

    const item =
        ocorrencias[index];

    confirmar(
        "Excluir ocorrência?",
        "Esta ocorrência será removida do apontamento quando você salvar a máquina.",
        () => {

            ocorrencias.splice(index,1);

            renderOccurrences();
        }
    );
}


function renderOccurrences(){

    occurrencesList.innerHTML = "";

    if(!ocorrencias.length){

        const empty =
            document.createElement("div");

        empty.style.color =
            "#6e6e73";

        empty.style.fontSize =
            "13px";

        empty.style.padding =
            "5px 2px 2px";

        empty.textContent =
            "Nenhuma ocorrência adicionada.";

        occurrencesList.appendChild(empty);

        return;
    }

    ocorrencias.forEach(
        (item,index) => {

            const row =
                document.createElement("div");

            row.className =
                "occurrence-item";

            const type =
                document.createElement("div");

            type.className =
                "occurrence-type";

            type.textContent =
                item.tipo || "Outro";

            const description =
                document.createElement("div");

            description.className =
                "occurrence-description";

            description.textContent =
                item.descricao || "";

            const actions =
                document.createElement("div");

            actions.className =
                "occurrence-actions";

            const edit =
                document.createElement("button");

            edit.type = "button";
            edit.className = "icon-btn";
            edit.textContent = "✎";

            edit.addEventListener(
                "click",
                () => editarOcorrencia(index)
            );

            const remove =
                document.createElement("button");

            remove.type = "button";
            remove.className =
                "icon-btn delete";

            remove.textContent =
                "×";

            remove.addEventListener(
                "click",
                () => removerOcorrencia(index)
            );

            actions.appendChild(edit);
            actions.appendChild(remove);

            row.appendChild(type);
            row.appendChild(description);
            row.appendChild(actions);

            occurrencesList.appendChild(row);
        }
    );
}


/* =========================================================
   SALVAR
========================================================= */

async function salvarMaquina(){

    if(!currentUser){

        showToast(
            "Sessão expirada."
        );

        return;
    }

    if(!turnIdAtual){

        showToast(
            "Não foi possível localizar o turno."
        );

        return;
    }

    if(!machineAtual){

        showToast(
            "Nenhuma máquina selecionada."
        );

        return;
    }

    const horaBoa =
        timeToMinutes(
            horaBoaInput.value
        );

    const reposicao =
        timeToMinutes(
            reposicaoInput.value
        );

    const total =
        horaBoa + reposicao;

    let saldo = null;

    if(
        saldoInput.value === "__CUSTOM__"
    ){

        const saldoMinutes =
            timeToMinutes(
                saldoValueInput.value
            );

        saldo =
            minutesToTime(
                saldoMinutes
            );
    }

    const observacao =
        observationInput.value.trim();

    const saveButton =
        document.getElementById(
            "saveMachineBtn"
        );

    saveButton.disabled = true;

    saveButton.textContent =
        "Salvando...";

    try{

        /*
         * A RPC centraliza a criação/atualização
         * do apontamento e das ocorrências.
         */

        const {
            data,
            error
        } = await supabaseClient
            .rpc(
                "salvar_apontamento_lider",
                {
                    p_data:
                        dateInput.value,

                    p_turno:
                        shiftInput.value,

                    p_setor:
                        sectorInput.value,

                    p_maquina:
                        machineAtual,

                    p_hora_boa:
                        minutesToTime(
                            horaBoa
                        ),

                    p_reposicao:
                        minutesToTime(
                            reposicao
                        ),

                    p_total_baixado:
                        minutesToTime(
                            total
                        ),

                    p_saldo:
                        saldo,

                    p_observacao:
                        observacao || null,

                    p_ocorrencias:
                        ocorrencias.map(
                            item => ({
                                tipo:
                                    item.tipo,

                                descricao:
                                    item.descricao
                            })
                        )
                }
            );

        if(error){
            throw error;
        }

        showToast(
            `${machineAtual} salvo ✓`
        );

        await carregarDados();

        /*
         * Volta automaticamente para
         * a grade após salvar.
         */

    }catch(error){

        console.error(
            "Erro ao salvar:",
            error
        );

        mostrarErro(
            "Não foi possível salvar.",
            error
        );

    }finally{

        saveButton.disabled = false;

        saveButton.textContent =
            "Salvar máquina";
    }
}


/* =========================================================
   EXCLUIR MÁQUINA
========================================================= */

async function excluirMaquina(){

    if(!apontamentoAtual){
        return;
    }

    confirmar(
        "Excluir apontamento?",
        `O apontamento da ${machineAtual} será excluído.`,
        async () => {

            try{

                /*
                 * Remove as ocorrências primeiro.
                 */

                const {
                    error:
                        occurrenceError
                } = await supabaseClient
                    .from("ocorrencias")
                    .delete()
                    .eq(
                        "apontamento_id",
                        apontamentoAtual.id
                    );

                if(occurrenceError){
                    throw occurrenceError;
                }

                const {
                    error
                } = await supabaseClient
                    .from("apontamentos")
                    .delete()
                    .eq(
                        "id",
                        apontamentoAtual.id
                    );

                if(error){
                    throw error;
                }

                showToast(
                    `${machineAtual} excluído ✓`
                );

                await carregarDados();

            }catch(error){

                console.error(
                    "Erro ao excluir:",
                    error
                );

                mostrarErro(
                    "Não foi possível excluir.",
                    error
                );
            }
        }
    );
}


/* =========================================================
   CONFIRMAÇÃO
========================================================= */

function confirmar(
    title,
    message,
    callback
){

    document.getElementById(
        "confirmTitle"
    ).textContent = title;

    document.getElementById(
        "confirmMessage"
    ).textContent = message;

    confirmCallback = callback;

    document
        .getElementById("confirmModal")
        .classList.remove("hidden");

    document.getElementById(
        "confirmActionBtn"
    ).onclick = async () => {

        const action =
            confirmCallback;

        fecharConfirmacao();

        if(action){
            await action();
        }
    };
}


function fecharConfirmacao(){

    document
        .getElementById("confirmModal")
        .classList.add("hidden");

    confirmCallback = null;
}


/* =========================================================
   ERROS
========================================================= */

function mostrarErro(
    titulo,
    error
){

    let message =
        error?.message ||
        "Erro desconhecido.";

    if(error?.details){
        message +=
            ` ${error.details}`;
    }

    if(error?.hint){
        message +=
            ` ${error.hint}`;
    }

    showToast(
        `${titulo} ${message}`
    );
}

/* =========================================================
   INICIALIZAÇÃO
========================================================= */

async function init(){

    try{

        const {
            data,
            error
        } = await supabaseClient
            .auth
            .getSession();

        if(error){
            throw error;
        }

        if(!data.session){

            window.location.href =
                "index.html";

            return;
        }

        currentUser =
            data.session.user;

        /*
         * Data atual local.
         */

        const now =
            new Date();

        const year =
            now.getFullYear();

        const month =
            pad(now.getMonth() + 1);

        const day =
            pad(now.getDate());

        dateInput.value =
            `${year}-${month}-${day}`;

        /*
         * Perfil.
         */

        const profileOk =
            await carregarPerfil();

        if(!profileOk){
            return;
        }

        /*
         * Grade inicial.
         */

        await carregarDados();

    }catch(error){

        console.error(
            "Erro na inicialização:",
            error
        );

        mostrarErro(
            "Não foi possível carregar o sistema.",
            error
        );
    }
}

   AUTENTICAÇÃO
========================================================= */

supabaseClient

    .onAuthStateChange(
        (event, session) => {

            if(
                event === "SIGNED_OUT" ||
                !session
            ){

                window.location.href =
                    "index.html";
            }
        }
    );


/* =========================================================
   START
========================================================= */

init();
