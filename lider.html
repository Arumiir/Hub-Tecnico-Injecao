<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">

<title>Controle de Produção — Líder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#f2f2f7;
    --card:#ffffff;
    --text:#1c1c1e;
    --muted:#8e8e93;
    --line:#e5e5ea;

    --blue:#007aff;
    --blue-soft:#eaf3ff;

    --green:#34c759;
    --green-soft:#e9f8ed;

    --yellow:#ffcc00;
    --yellow-soft:#fff8d9;

    --red:#ff3b30;
    --red-soft:#ffebe9;

    --danger:#ff3b30;

    --shadow:0 2px 12px rgba(0,0,0,.045);
    --radius:18px;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:var(--bg);
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing:antialiased;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:default;
}

.hidden{
    display:none !important;
}


/* =========================
   APP
========================= */

.container{
    width:min(100%,760px);
    margin:0 auto;

    padding:
        max(14px,env(safe-area-inset-top))
        16px
        calc(28px + env(safe-area-inset-bottom));
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:20;

    margin:
        calc(-1 * max(14px,env(safe-area-inset-top)))
        -16px
        18px;

    padding:
        calc(16px + max(14px,env(safe-area-inset-top)))
        18px
        16px;

    background:rgba(242,242,247,.88);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    border-bottom:1px solid rgba(0,0,0,.06);
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
}

.header-brand{
    min-width:0;
}

.header h1{
    margin:0;

    font-size:21px;
    line-height:1.15;
    font-weight:750;
    letter-spacing:-.45px;
}

.header-subtitle{
    margin:5px 0 0;

    color:var(--muted);

    font-size:14px;
    font-weight:500;
}

.user-name{
    margin-top:14px;

    font-size:14px;
    font-weight:650;

    color:var(--text);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.header-button{
    flex:none;

    border:0;

    background:rgba(255,255,255,.8);

    color:var(--blue);

    border-radius:12px;

    padding:9px 12px;

    font-size:13px;
    font-weight:650;

    box-shadow:0 1px 4px rgba(0,0,0,.04);
}

.logout{
    flex:none;

    border:0;

    background:rgba(255,255,255,.8);

    color:var(--blue);

    border-radius:12px;

    padding:9px 13px;

    font-size:14px;
    font-weight:600;

    box-shadow:0 1px 4px rgba(0,0,0,.04);
}


/* =========================
   CONTEXTO
========================= */

.controls{
    background:var(--card);

    border-radius:var(--radius);

    padding:18px;

    margin-bottom:14px;

    box-shadow:var(--shadow);
}

.context-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:0;
}

.context-date{
    grid-column:1 / -1;
}

.field{
    min-width:0;
}

.field label{
    display:block;

    margin:0 0 7px 2px;

    color:var(--muted);

    font-size:12px;
    font-weight:650;
}

input,
select,
textarea{
    width:100%;

    border:1px solid var(--line);

    border-radius:13px;

    padding:12px 13px;

    background:#fff;

    color:var(--text);

    outline:none;

    transition:
        border-color .15s ease,
        box-shadow .15s ease,
        background .15s ease;
}

input,
select{
    min-height:46px;
}

textarea{
    resize:vertical;

    line-height:1.4;
}

input:focus,
select:focus,
textarea:focus{
    border-color:rgba(0,122,255,.45);

    box-shadow:
        0 0 0 3px rgba(0,122,255,.10);
}


/* =========================
   MÁQUINAS
========================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:18px 2px 10px;
}

.section-title h2{
    margin:0;

    font-size:16px;
    font-weight:750;

    letter-spacing:-.2px;
}

.section-title span{
    color:var(--muted);

    font-size:12px;
    font-weight:600;
}

.machine-grid{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:9px;
}

.machine-button{
    position:relative;

    min-height:58px;

    border:1px solid var(--line);

    border-radius:15px;

    background:#fff;

    color:var(--text);

    font-size:15px;
    font-weight:700;

    box-shadow:
        0 1px 4px rgba(0,0,0,.025);

    transition:
        transform .12s ease,
        background .15s ease,
        border-color .15s ease;
}

.machine-button:active{
    transform:scale(.97);
}

.machine-button.saved{
    background:var(--green-soft);

    border-color:rgba(52,199,89,.25);

    color:#248a3d;
}

.machine-button.saved::after{
    content:"✓";

    position:absolute;

    top:5px;
    right:7px;

    font-size:11px;
    font-weight:800;

    color:var(--green);
}


/* =========================
   TELA DA MÁQUINA
========================= */

.machine-screen{
    margin-top:14px;
}

.machine-card{
    background:var(--card);

    border-radius:var(--radius);

    padding:18px;

    box-shadow:var(--shadow);
}

.machine-screen-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:12px;

    margin-bottom:17px;
}

.machine-screen-title{
    display:flex;

    align-items:center;

    gap:9px;

    font-size:20px;
    font-weight:750;

    letter-spacing:-.35px;
}

.machine-screen-title::before{
    content:"";

    width:9px;
    height:9px;

    border-radius:50%;

    background:var(--blue);

    box-shadow:
        0 0 0 4px var(--blue-soft);
}

.back-button{
    border:0;

    background:#f2f2f7;

    color:var(--blue);

    border-radius:12px;

    padding:9px 12px;

    font-size:13px;
    font-weight:650;
}

.hours-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;
}

.total-box{
    grid-column:1 / -1;

    border-radius:14px;

    padding:12px 14px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    min-height:58px;

    transition:.15s ease;
}

.total-box.status-green{
    background:var(--green-soft);

    color:#248a3d;
}

.total-box.status-yellow{
    background:var(--yellow-soft);

    color:#9a7900;
}

.total-box.status-red{
    background:var(--red-soft);

    color:#c72e25;
}

.total-label{
    font-size:12px;
    font-weight:650;
}

.total-value{
    font-size:19px;
    font-weight:750;

    letter-spacing:-.3px;
}

.section-label{
    display:block;

    margin:17px 0 7px 2px;

    color:var(--muted);

    font-size:12px;
    font-weight:650;
}


/* =========================
   OCORRÊNCIAS
========================= */

.occurrences-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-top:19px;
}

.occurrences-header .section-label{
    margin:0;
}

.add-occurrence{
    border:0;

    background:var(--blue-soft);

    color:var(--blue);

    border-radius:11px;

    padding:8px 11px;

    font-size:12px;
    font-weight:700;
}

.occurrence-list{
    margin-top:9px;
}

.occurrence{
    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:10px;

    padding:12px;

    margin-bottom:8px;

    background:#f7f7f9;

    border:1px solid var(--line);

    border-radius:13px;
}

.occurrence-content{
    min-width:0;
}

.occurrence-type{
    font-size:12px;

    font-weight:750;

    color:var(--text);
}

.occurrence-description{
    margin-top:4px;

    font-size:13px;

    line-height:1.4;

    color:#48484a;

    word-break:break-word;
}

.occurrence-actions{
    display:flex;

    flex:none;

    gap:5px;
}

.occurrence-action{
    border:0;

    background:#fff;

    color:var(--blue);

    border-radius:9px;

    padding:7px 9px;

    font-size:11px;
    font-weight:650;
}

.occurrence-action.delete{
    color:var(--danger);
}

.occurrence-editor{
    margin-top:9px;

    padding:13px;

    background:#f7f7f9;

    border:1px solid var(--line);

    border-radius:14px;
}

.occurrence-editor-grid{
    display:grid;

    grid-template-columns:1fr;

    gap:9px;
}

.occurrence-editor-actions{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:9px;
}

.occurrence-save{
    border:0;

    background:var(--blue);

    color:#fff;

    border-radius:11px;

    min-height:43px;

    font-weight:700;
}

.occurrence-cancel{
    border:0;

    background:#e5e5ea;

    color:var(--text);

    border-radius:11px;

    min-height:43px;

    font-weight:650;
}

.empty-occurrences{
    padding:12px;

    background:#f7f7f9;

    border-radius:12px;

    color:var(--muted);

    font-size:13px;
}


/* =========================
   OBSERVAÇÃO
========================= */

.observation{
    min-height:90px;
}


/* =========================
   AÇÕES DA MÁQUINA
========================= */

.machine-actions{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:9px;

    margin-top:18px;
}

.save-machine{
    min-height:48px;

    border:0;

    background:var(--green);

    color:#fff;

    border-radius:13px;

    padding:11px 15px;

    font-weight:700;

    box-shadow:
        0 2px 6px rgba(52,199,89,.18);
}

.delete-machine{
    min-height:48px;

    border:0;

    background:var(--red-soft);

    color:var(--danger);

    border-radius:13px;

    padding:11px 15px;

    font-weight:650;
}


/* =========================
   FECHAMENTO
========================= */

.closing-card{
    background:var(--card);

    border-radius:var(--radius);

    padding:18px;

    margin-top:15px;

    box-shadow:var(--shadow);
}

.closing-card h2{
    margin:0 0 4px;

    font-size:18px;
    font-weight:750;

    letter-spacing:-.2px;
}

.closing-subtitle{
    margin:0 0 13px;

    color:var(--muted);

    font-size:13px;
}

.closing-text{
    min-height:250px;

    resize:vertical;

    background:#f7f7f9;

    border-color:var(--line);

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size:13px;

    line-height:1.55;
}

.copy-btn{
    width:100%;

    min-height:46px;

    margin-top:10px;

    border:0;

    background:var(--blue);

    color:#fff;

    border-radius:13px;

    padding:11px 15px;

    font-weight:700;
}


/* =========================
   LOADING / EMPTY
========================= */

.loading,
.empty{
    background:var(--card);

    border-radius:var(--radius);

    padding:32px 20px;

    text-align:center;

    color:var(--muted);

    box-shadow:var(--shadow);

    font-size:14px;
}

.loading{
    min-height:100px;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;

    bottom:
        calc(20px + env(safe-area-inset-bottom));

    transform:
        translate(-50%,10px);

    width:max-content;

    max-width:calc(100% - 32px);

    background:rgba(28,28,30,.94);

    color:#fff;

    padding:11px 16px;

    border-radius:14px;

    font-size:13px;
    font-weight:600;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s ease,
        transform .2s ease;

    z-index:1000;

    box-shadow:
        0 5px 20px rgba(0,0,0,.18);
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================
   RESPONSIVO
========================= */

@media(max-width:520px){

    .container{
        width:100%;

        padding-left:12px;
        padding-right:12px;
    }

    .header{
        margin-left:-12px;
        margin-right:-12px;

        padding-left:16px;
        padding-right:16px;
    }

    .header h1{
        font-size:20px;
    }

    .header-actions{
        gap:4px;
    }

    .header-button{
        padding:8px 9px;
    }

    .logout{
        padding:8px 10px;
    }

    .controls{
        padding:15px;
    }

    .context-grid{
        grid-template-columns:1fr 1fr;

        gap:9px;
    }

    .machine-grid{
        grid-template-columns:
            repeat(4,minmax(0,1fr));

        gap:8px;
    }

    .machine-button{
        min-height:54px;

        font-size:14px;
    }

    .machine-card{
        padding:16px;
    }
}

@media(max-width:360px){

    .header h1{
        font-size:18px;
    }

    .machine-grid{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .machine-actions{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="header-top">

            <div class="header-brand">

                <h1>
                    CONTROLE DE PRODUÇÃO
                </h1>

                <p class="header-subtitle">
                    Setor de Injeção · Líder
                </p>

            </div>


            <div class="header-actions">

                <button
                    id="acessosButton"
                    class="header-button hidden"
                    onclick="abrirAcessos()">
                    Acessos
                </button>

                <button
                    class="logout"
                    onclick="logout()">
                    Sair
                </button>

            </div>

        </div>


        <div
            id="userName"
            class="user-name">
        </div>

    </header>


    <!-- =========================
         CONTEXTO
    ========================= -->

    <section class="controls">

        <div class="context-grid">

            <div class="field context-date">

                <label for="data">
                    Data
                </label>

                <input
                    type="date"
                    id="data">

            </div>


            <div class="field">

                <label for="shift">
                    Turno
                </label>

                <select id="shift">

                    <option value="1º turno">
                        1º turno
                    </option>

                    <option value="2º turno">
                        2º turno
                    </option>

                    <option value="3º turno">
                        3º turno
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="sector">
                    Setor
                </label>

                <select id="sector">

                    <option value="A">
                        A
                    </option>

                    <option value="B">
                        B
                    </option>

                    <option value="C">
                        C
                    </option>

                </select>

            </div>

        </div>

    </section>


    <!-- =========================
         LISTA DE MÁQUINAS
    ========================= -->

    <section id="machineListSection">

        <div class="section-title">

            <h2>
                Máquinas
            </h2>

            <span id="machineRange">
                M01–M29
            </span>

        </div>


        <div
            id="machineGrid"
            class="machine-grid">
        </div>

    </section>


    <!-- =========================
         TELA DA MÁQUINA
    ========================= -->

    <section
        id="machineScreen"
        class="machine-screen hidden">

        <div class="machine-card">

            <div class="machine-screen-header">

                <div
                    id="machineScreenTitle"
                    class="machine-screen-title">
                    M01
                </div>

                <button
                    class="back-button"
                    onclick="voltarMaquinas()">
                    Voltar
                </button>

            </div>


            <!-- HORAS -->

            <div class="hours-grid">

                <div class="field">

                    <label for="horaBoa">
                        Hora boa
                    </label>

                    <input
                        type="text"
                        id="horaBoa"
                        inputmode="decimal"
                        placeholder="Ex.: 07:41">

                </div>


                <div class="field">

                    <label for="reposicao">
                        Reposição
                    </label>

                    <input
                        type="text"
                        id="reposicao"
                        inputmode="decimal"
                        placeholder="Ex.: 00:40">

                </div>


                <div
                    id="totalBox"
                    class="total-box status-red">

                    <div class="total-label">
                        Total baixado
                    </div>

                    <div
                        id="totalValue"
                        class="total-value">
                        00:00
                    </div>

                </div>

            </div>


            <!-- SALDO -->

            <label
                class="section-label"
                for="saldo">
                Saldo
            </label>

            <input
                type="text"
                id="saldo"
                inputmode="decimal"
                placeholder="Ex.: 05:12">


            <!-- OCORRÊNCIAS -->

            <div class="occurrences-header">

                <label class="section-label">
                    Ocorrências
                </label>

                <button
                    class="add-occurrence"
                    onclick="abrirEditorOcorrencia()">
                    + Adicionar ocorrência
                </button>

            </div>


            <div
                id="occurrenceEditor"
                class="occurrence-editor hidden">

                <div class="occurrence-editor-grid">

                    <div class="field">

                        <label for="occurrenceCategory">
                            Categoria
                        </label>

                        <select id="occurrenceCategory">

                            <option value="Mecânico">
                                Mecânico
                            </option>

                            <option value="Elétrico">
                                Elétrico
                            </option>

                            <option value="Matriz">
                                Matriz
                            </option>

                            <option value="Material">
                                Material
                            </option>

                            <option value="Processo">
                                Processo
                            </option>

                            <option value="Parada de máquina">
                                Parada de máquina
                            </option>

                            <option value="Setup">
                                Setup
                            </option>

                            <option value="Outro">
                                Outro
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="occurrenceDescription">
                            Descrição
                        </label>

                        <textarea
                            id="occurrenceDescription"
                            rows="3"
                            placeholder="Descreva a ocorrência">
                        </textarea>

                    </div>

                </div>


                <div class="occurrence-editor-actions">

                    <button
                        class="occurrence-cancel"
                        onclick="fecharEditorOcorrencia()">
                        Cancelar
                    </button>

                    <button
                        class="occurrence-save"
                        onclick="adicionarOcorrenciaLocal()">
                        Adicionar
                    </button>

                </div>

            </div>


            <div
                id="occurrenceList"
                class="occurrence-list">
            </div>


            <!-- OBSERVAÇÃO -->

            <label
                class="section-label"
                for="observacao">
                Observação
            </label>

            <textarea
                id="observacao"
                class="observation"
                rows="4"
                placeholder="Observação geral da máquina">
            </textarea>


            <!-- AÇÕES -->

            <div class="machine-actions">

                <button
                    id="saveMachineButton"
                    class="save-machine"
                    onclick="salvarMaquina()">
                    Salvar máquina
                </button>


                <button
                    id="deleteMachineButton"
                    class="delete-machine"
                    onclick="excluirMaquina()">
                    Excluir apontamento
                </button>

            </div>

        </div>

    </section>


    <!-- =========================
         FECHAMENTO
    ========================= -->

    <section
        id="closingCard"
        class="closing-card">

        <h2>
            Fechamento do turno
        </h2>

        <p class="closing-subtitle">
            Texto pronto para copiar e enviar.
        </p>


        <textarea
            id="closingText"
            class="closing-text"
            readonly>
        </textarea>


        <button
            class="copy-btn"
            onclick="copiarFechamento()">
            Copiar fechamento
        </button>

    </section>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://icajmncojvidhrqlbevq.supabase.co";

const SUPABASE_KEY =

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const shiftTargets = {

    "1º turno":
        8 * 60 + 48,

    "2º turno":
        8 * 60 + 36,

    "3º turno":
        6 * 60 + 36

};


const sectorMachines = {

        start:1,
        end:29
    },

    B:{

    },

    C:{
        start:52,
        end:85
    }

};


/* =========================================================
   ESTADO
========================================================= */

let session = null;

let perfil = null;

let turnoAtual = null;

let maquinaAtual = null;

let apontamentoAtual = null;

let ocorrenciasLocais = [];

let dadosApontamentos = [];


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        definirDataHoje();

        document
            .getElementById("shift")
            .addEventListener(
                "change",
                contextoAlterado
            );

        document
            .getElementById("sector")
            .addEventListener(
                "change",
                contextoAlterado
            );

        document
            .getElementById("data")
            .addEventListener(
                "change",
                contextoAlterado
            );


        document
            .getElementById("horaBoa")
            .addEventListener(
                "input",
                atualizarTotal
            );


        document
            .getElementById("reposicao")
            .addEventListener(
                "input",
                atualizarTotal
            );


        await verificarAcesso();

    }
);


/* =========================================================
   DATA
========================================================= */

function definirDataHoje(){

    const hoje =
        new Date();

    const ano =
        hoje.getFullYear();

    const mes =
        String(
            hoje.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const dia =
        String(
            hoje.getDate()
        ).padStart(
            2,
            "0"
        );

    document.getElementById(
        "data"
    ).value =
        `${ano}-${mes}-${dia}`;

}


/* =========================================================
   AUTENTICAÇÃO
========================================================= */

async function verificarAcesso(){

    const {
        data:{
            session:currentSession
        }
    } =
        await supabaseClient
            .auth
            .getSession();


    if(
        !currentSession
    ){

        window.location.href =
            "index.html";

        return;
    }


    session =
        currentSession;


    const {
        data:usuario,
        error
    } =
        await supabaseClient
            .from("usuarios")
            .select("*")
            .eq(
                "id",
                session.user.id
            )
            .eq(
                "ativo",
                true
            )
            .single();


    if(
        error ||
        !usuario
    ){

        alert(
            "Usuário sem cadastro no sistema."
        );

        await supabaseClient
            .auth
            .signOut();

        window.location.href =
            "index.html";

        return;
    }


    if(
        usuario.perfil !== "lider"
    ){

        if(
            usuario.perfil === "supervisor"
        ){

            window.location.href =
                "supervisor.html";

            return;
        }


        alert(
            "Acesso restrito ao líder."
        );

        await supabaseClient
            .auth
            .signOut();

        window.location.href =
            "index.html";

        return;
    }


    perfil =
        usuario;


    document.getElementById(
        "userName"
    ).textContent =
        usuario.nome;


    if(
        usuario.admin === true
    ){

        document
            .getElementById(
                "acessosButton"
            )
            .classList.remove(
                "hidden"
            );

    }


    renderMachineGrid();

    await carregarDados();

}

   MUDANÇA DE CONTEXTO

/* =========================================================
   GRID DE MÁQUINAS
========================================================= */

function renderMachineGrid(){

    const setor =
        document.getElementById(
            "sector"
        ).value;


    const range =
        sectorMachines[
            setor
        ];


    document.getElementById(
        "machineRange"
    ).textContent =
        `M${String(
            range.start
        ).padStart(2,"0")}–M${String(
            range.end
        ).padStart(2,"0")}`;


    const grid =
        document.getElementById(
            "machineGrid"
        );


    grid.innerHTML = "";


    for(
        let numero =
            range.start;

        numero <=
            range.end;

        numero++
    ){

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "machine-button";


        const possui =
            dadosApontamentos.some(
                item =>
                    Number(
                        item.maquina
                    ) ===
                    numero
            );


        if(
            possui
        ){

            button.classList.add(
                "saved"
            );

        }


        button.textContent =
            formatMachine(
                numero
            );


        button.addEventListener(
            "click",
            () =>
                abrirMaquina(
                    numero
                )
        );


        grid.appendChild(
            button
        );

    }

}


/* =========================================================
   CARREGAR DADOS
========================================================= */

async function carregarDados(){

    const data =
        document.getElementById(
            "data"
        ).value;


    const turno =
        document.getElementById(
            "shift"
        ).value;


    const setor =
        document.getElementById(
            "sector"
        ).value;


    dadosApontamentos = [];


    /*
       Primeiro localizamos somente
       o turno do líder atual, na
       combinação exata:

       DATA
       TURNO
       SETOR
       LÍDER
    */

    const {
        data:turnos,
        error
    } =
        await supabaseClient
            .from("turnos")
            .select(`
                id,
                data,
                turno,
                setor,
                lider_id
            `)
            .eq(
                "data",
                data
            )
            .eq(
                "turno",
                turno
            )
            .eq(
                "setor",
                setor
            )
            .eq(
                "lider_id",
                session.user.id
            );


    if(error){

        console.error(
            "Erro ao carregar turnos:",
            error
        );


        mostrarErroSupabase(
            "Erro ao carregar os dados",
            error
        );


        renderMachineGrid();

        atualizarFechamento();

        return;
    }


    if(
        !turnos ||
        !turnos.length
    ){

        renderMachineGrid();

        atualizarFechamento();

        return;
    }


    const turnoIds =
        turnos.map(
            item =>
                item.id
        );


    /*
       Busca os apontamentos somente
       dos turnos encontrados.
    */

    const {
        data:apontamentos,
        error:apontamentosError
    } =
        await supabaseClient
            .from("apontamentos")
            .select(`
                id,
                turno_id,
                maquina,
                hora_boa,
                reposicao,
                total_baixado,
                saldo,
                observacao,
                ocorrencias (
                    id,
                    apontamento_id,
                    categoria,
                    descricao
                )
            `)
            .in(
                "turno_id",
                turnoIds
            );


    if(
        apontamentosError
    ){

        console.error(
            "Erro ao carregar apontamentos:",
            apontamentosError
        );


        mostrarErroSupabase(
            "Erro ao carregar apontamentos",
            apontamentosError
        );


        renderMachineGrid();

        atualizarFechamento();

        return;
    }


    dadosApontamentos =
        (apontamentos || [])
            .map(
                item => ({
                    ...item,
                    maquina:
                        normalizarMaquina(
                            item.maquina
                        )
                })
            )
            .filter(
                item =>
                    item.maquina !== null
            );


    renderMachineGrid();

    atualizarFechamento();

}


/* =========================================================
   ABRIR MÁQUINA
========================================================= */

async function abrirMaquina(
    numero
){

    maquinaAtual =
        Number(
            numero
        );


    const existente =
        dadosApontamentos.find(
            item =>
                Number(
                    item.maquina
                ) ===
                maquinaAtual
        );


    apontamentoAtual =
        existente ||
        null;


    if(
        existente
    ){

        preencherFormulario(
            existente
        );

    }else{

        limparFormulario();

    }


    document.getElementById(
        "machineScreenTitle"
    ).textContent =
        formatMachine(
            maquinaAtual
        );


    document
        .getElementById(
            "machineListSection"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "closingCard"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "machineScreen"
        )
        .classList.remove(
            "hidden"
        );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function renderOcorrencias(){

    const container =

            "occurrenceList"
        );


    if(
        !ocorrenciasLocais.length
    ){

        container.innerHTML = `

            <div class="empty-occurrences">

    container.innerHTML = "";


    ocorrenciasLocais.forEach(
        (
            ocorrencia,
            index
        ) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "occurrence";


            item.innerHTML = `

                <div class="occurrence-content">

                    <div class="occurrence-type">

                    </div>

                    <div class="occurrence-description">

                        onclick="removerOcorrenciaLocal(
                            ${index}
                        )">

                    </button>

                </div>

            `;


            container.appendChild(
                item
            );

        }
    );

}


function removerOcorrenciaLocal(
    index
){

    ocorrenciasLocais.splice(
        index,
        1
    );


    renderOcorrencias();

}


/* =========================================================
   SALVAR MÁQUINA
========================================================= */

async function salvarMaquina(){

    if(
        !maquinaAtual
    ){

        mostrarToast(
            "Selecione uma máquina."
        );

        return;
    }


    const button =
        document.getElementById(
            "saveMachineButton"
        );


    const data =
        document.getElementById(
            "data"
        ).value;


    const turno =
        document.getElementById(
            "shift"
        ).value;


    const setor =
        document.getElementById(
            "sector"
        ).value;


    const horaBoa =
        parseTime(
            document.getElementById(
                "horaBoa"
            ).value
        );


    const reposicao =
        parseTime(
            document.getElementById(
                "reposicao"
            ).value
        );


    const total =
        horaBoa +
        reposicao;


    const saldoTexto =
        document.getElementById(
            "saldo"
        ).value.trim();


    const saldo =
        saldoTexto
            ? parseTime(
                saldoTexto
            )
            : 0;


    const observacao =
        document.getElementById(
            "observacao"
        ).value.trim();


    button.disabled =
        true;


    button.textContent =
        "Salvando...";


    try{

        /* =========================================
           1. LOCALIZAR OU CRIAR O TURNO
        ========================================= */

        const {
            data:turnosExistentes,
            error:turnoBuscaError
        } =
            await supabaseClient
                .from("turnos")
                .select(`
                    id,
                    data,
                    turno,
                    setor,
                    lider_id
                `)
                .eq(
                    "data",
                    data
                )
                .eq(
                    "turno",
                    turno
                )
                .eq(
                    "setor",
                    setor
                )
                .eq(
                    "lider_id",
                    session.user.id
                )
                .limit(1);


        if(
            turnoBuscaError
        ){

            throw turnoBuscaError;

        }


        if(
            turnosExistentes &&
            turnosExistentes.length
        ){

            turnoAtual =
                turnosExistentes[0];

        }else{

            const {
                data:novoTurno,
                error:turnoInsertError
            } =
                await supabaseClient
                    .from("turnos")
                    .insert({

                        data:
                            data,

                        turno:
                            turno,

                        setor:
                            setor,

                        lider_id:
                            session.user.id

                    })
                    .select()
                    .single();


            if(
                turnoInsertError
            ){

                throw turnoInsertError;

            }


            turnoAtual =
                novoTurno;

        }


        /* =========================================
           2. LOCALIZAR APONTAMENTO EXISTENTE
        ========================================= */

        const {
            data:apontamentosExistentes,
            error:apontamentoBuscaError
        } =
            await supabaseClient
                .from("apontamentos")
                .select("*")
                .eq(
                    "turno_id",
                    turnoAtual.id
                )
                .eq(
                    "maquina",
                    maquinaAtual
                )
                .limit(1);


        if(
            apontamentoBuscaError
        ){

            throw apontamentoBuscaError;

        }


        let apontamento;


        /* =========================================
           3. ATUALIZAR OU INSERIR
        ========================================= */

        const payload = {

            turno_id:
                turnoAtual.id,

            maquina:
                maquinaAtual,

            hora_boa:
                horaBoa,

            reposicao:
                reposicao,

            total_baixado:
                total,

            saldo:
                saldo,

            observacao:
                observacao ||
                null

        };


        if(
            apontamentosExistentes &&
            apontamentosExistentes.length
        ){

            const existente =
                apontamentosExistentes[0];


            const {
                data:atualizado,
                error:updateError
            } =
                await supabaseClient
                    .from("apontamentos")
                    .update({

                        hora_boa:
                            horaBoa,

                        reposicao:
                            reposicao,

                        total_baixado:
                            total,

                        saldo:
                            saldo,

                        observacao:
                            observacao ||
                            null

                    })
                    .eq(
                        "id",
                        existente.id
                    )
                    .select()
                    .single();


            if(
                updateError
            ){

                throw updateError;

            }


            apontamento =
                atualizado;

        }else{

            const {
                data:novoApontamento,
                error:insertError
            } =
                await supabaseClient
                    .from("apontamentos")
                    .insert(
                        payload
                    )
                    .select()
                    .single();


            if(
                insertError
            ){

                throw insertError;

            }


            apontamento =
                novoApontamento;

        }


        /* =========================================
           4. OCORRÊNCIAS
        ========================================= */

        /*
           Primeiro excluímos as ocorrências
           antigas deste apontamento.

           Elas serão recriadas com o estado
           atual da tela.
        */

        const {
            error:deleteOccurrencesError
        } =
            await supabaseClient
                .from("ocorrencias")
                .delete()
                .eq(
                    "apontamento_id",
                    apontamento.id
                );


        if(
            deleteOccurrencesError
        ){

            throw deleteOccurrencesError;

        }


        if(
            ocorrenciasLocais.length
        ){

            const ocorrenciasParaInserir =
                ocorrenciasLocais.map(
                    ocorrencia => ({

                        apontamento_id:
                            apontamento.id,

                        categoria:
                            ocorrencia.categoria,

                        descricao:
                            ocorrencia.descricao

                    })
                );


            const {
                error:occurrencesInsertError
            } =
                await supabaseClient
                    .from("ocorrencias")
                    .insert(
                        ocorrenciasParaInserir
                    );


            if(
                occurrencesInsertError
            ){

                throw occurrencesInsertError;

            }

        }


        /* =========================================
           5. RECARREGAR DADOS
        ========================================= */

        mostrarToast(
            `${formatMachine(
                maquinaAtual
            )} salvo ✓`
        );


        await carregarDados();


        /* =========================================
           6. VOLTAR PARA GRID
        ========================================= */

        fecharTelaMaquina();


    }catch(error){

        console.error(
            "ERRO AO SALVAR MÁQUINA:",
            error
        );


        mostrarErroSupabase(
            "Não foi possível salvar",
            error
        );

    }finally{

        button.disabled =
            false;


        button.textContent =
            "Salvar máquina";

    }

}


/* =========================================================
   EXCLUIR APONTAMENTO
========================================================= */

async function excluirMaquina(){

    if(
        !apontamentoAtual ||
        !apontamentoAtual.id
    ){

        mostrarToast(
            "Não existe apontamento para excluir."
        );

        return;
    }


    const confirmar =
        confirm(
            `Excluir o apontamento da ${formatMachine(
                maquinaAtual
            )}?`
        );


    if(
        !confirmar
    ){

        return;
    }


    const button =
        document.getElementById(
            "deleteMachineButton"
        );


    button.disabled =
        true;


    button.textContent =
        "Excluindo...";


    try{

        /*
           Ocorrências primeiro.
        */

        const {
            error:occurrenceError
        } =
            await supabaseClient
                .from("ocorrencias")
                .delete()
                .eq(
                    "apontamento_id",
                    apontamentoAtual.id
                );


        if(
            occurrenceError
        ){

            throw occurrenceError;

        }


        const {
            error:apontamentoError
        } =
            await supabaseClient
                .from("apontamentos")
                .delete()
                .eq(
                    "id",
                    apontamentoAtual.id
                );


        if(
            apontamentoError
        ){

            throw apontamentoError;

        }


        mostrarToast(
            `${formatMachine(
                maquinaAtual
            )} excluído ✓`
        );


        await carregarDados();


        fecharTelaMaquina();


    }catch(error){

        console.error(
            "Erro ao excluir:",
            error
        );


        mostrarErroSupabase(
            "Não foi possível excluir",
            error
        );

    }finally{

        button.disabled =
            false;


        button.textContent =
            "Excluir apontamento";

    }

}

/* =========================================================
   FECHAMENTO
========================================================= */

function atualizarFechamento(){

    const setor =
        document.getElementById(
            "sector"
        ).value;


    const linhas = [];


    linhas.push(
        `Horas baixadas setor ${setor}`
    );


    linhas.push("");


    if(
        dadosApontamentos.length
    ){

        const ordenados =
            [...dadosApontamentos]
                .sort(
                    (a,b) =>
                        Number(a.maquina) -
                        Number(b.maquina)
                );


        for(
            const item of ordenados
        ){

            const maquina =
                formatMachine(
                    item.maquina
                );


            const total =
                formatMinutes(
                    item.total_baixado
                );


            let linha =
                `${maquina} - ${total}`;


            if(
                item.saldo !== null &&
                item.saldo !== undefined &&
                Number(item.saldo) !== 0
            ){

                linha +=
                    ` (Saldo - ${formatMinutes(
                        item.saldo
                    )})`;

            }


            if(
                item.observacao
            ){

                linha +=
                    ` — ${item.observacao}`;

            }


            linhas.push(
                linha
            );

        }

    }


    document.getElementById(
        "closingText"
    ).value =
        linhas.join(
            "\n"
        );

}


/* =========================================================
   COPIAR FECHAMENTO
========================================================= */

async function copiarFechamento(){

    const texto =
        document.getElementById(
            "closingText"
        ).value;


    try{

        await navigator.clipboard.writeText(
            texto
        );


        mostrarToast(
            "Fechamento copiado ✓"
        );


    }catch(error){

        console.error(
            error
        );


        mostrarToast(
            "Não foi possível copiar."
        );

    }

}

function getStatusClass(
    totalMinutes
){

    const turno =
        document.getElementById(
            "shift"
        ).value;


    const target =
        shiftTargets[
            turno
        ];


    if(
        totalMinutes >=
        target
    ){

        return "status-green";

    }


    if(
        totalMinutes >=
        target - 48
    ){

        return "status-yellow";

    }


    return "status-red";

}


/* =========================================================
   TEMPO
========================================================= */

function parseTime(
    value
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return 0;

    }


    value =
        String(
            value
        )
        .trim()
        .replace(
            ",",
            ":"
        );


    /*
       Aceita:

       07:41
       0741
       7:41
       5
    */

    if(
        /^\d{3,4}$/.test(
            value
        )
    ){

        if(
            value.length === 3
        ){

            const horas =
                Number(
                    value.slice(
                        0,
                        1
                    )
                );


            const minutos =
                Number(
                    value.slice(
                        1
                    )
                );


            return (
                horas * 60 +
                minutos
            );

        }


        if(
            value.length === 4
        ){

            const horas =
                Number(
                    value.slice(
                        0,
                        2
                    )
                );


            const minutos =
                Number(
                    value.slice(
                        2
                    )
                );


            return (
                horas * 60 +
                minutos
            );

        }

    }


    if(
        value.includes(":")
    ){

        const parts =
            value.split(":");


        const horas =
            Number(
                parts[0]
            ) || 0;


        const minutos =
            Number(
                parts[1]
            ) || 0;


        return (
            horas * 60 +
            minutos
        );

    }


    const numero =
        Number(
            value
        );


    return Number.isFinite(
        numero
    )
        ? numero
        : 0;

}


function formatMinutes(
    minutes
){

    minutes =
        Number(
            minutes
        ) || 0;


    const negativo =
        minutes < 0;


    minutes =
        Math.abs(
            minutes
        );


    const horas =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    const resultado =
        `${String(
            horas
        ).padStart(
            2,
            "0"
        )}:${String(
            mins
        ).padStart(
            2,
            "0"
        )}`;


    return negativo
        ? `-${resultado}`
        : resultado;

}


/* =========================================================
   MÁQUINAS
========================================================= */

function normalizarMaquina(
    valor
){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return null;

    }


    let texto =
        String(
            valor
        )
        .trim()
        .toUpperCase();


    texto =
        texto.replace(
            /^M/,
            ""
        );


    const numero =
        Number(
            texto
        );


    if(
        !Number.isInteger(
            numero
        ) ||
        numero <= 0
    ){

        return null;

    }


    return numero;

}


function formatMachine(
    valor
){

    const numero =
        normalizarMaquina(
            valor
        );


    if(
        numero === null
    ){

        return "M--";

    }


    return `M${String(
        numero
    ).padStart(
        2,
        "0"
    )}`;

}


/* =========================================================
   ERRO SUPABASE
========================================================= */

function mostrarErroSupabase(
    titulo,
    error
){

    const mensagem =
        error?.message ||
        "Erro desconhecido.";


    const detalhe =
        error?.details ||
        "";


    const hint =
        error?.hint ||
        "";


    console.error(
        titulo,
        {
            message:mensagem,
            details:detalhe,
            hint:hint,
            code:error?.code
        }
    );


    let texto =
        mensagem;


    if(
        detalhe
    ){

        texto +=
            ` — ${detalhe}`;

    }


    mostrarToast(
        texto
    );

}


/* =========================================================
   UTILITÁRIOS
========================================================= */

function escapeHtml(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function mostrarToast(
    texto
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        texto;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}
