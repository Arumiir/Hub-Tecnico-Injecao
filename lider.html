<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://icajmncojvidhrqlbevq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vQFsGutuZDHBruMghZkQYQ_BSwEBXFp";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ESTADO
========================================================= */

let currentUser = null;
let currentProfile = null;

let machineAtual = null;
let apontamentoAtual = null;

let ocorrenciasAtuais = [];

let occurrenceEditIndex = null;


/* =========================================================
   METAS
========================================================= */

const shiftTargets = {

    "1º turno":
        8 * 60 + 48,

    "2º turno":
        8 * 60 + 36,

    "3º turno":
        6 * 60 + 36

};


/* =========================================================
   ELEMENTOS
========================================================= */

const dateInput =
    document.getElementById("date");

const shiftInput =
    document.getElementById("shift");

const sectorInput =
    document.getElementById("sector");

const leaderName =
    document.getElementById("leaderName");

const userAvatar =
    document.getElementById("userAvatar");

const machineGrid =
    document.getElementById("machineGrid");

const machineListSection =
    document.getElementById("machineListSection");

const machineScreen =
    document.getElementById("machineScreen");

const mainHeader =
    document.getElementById("mainHeader");

const contextSection =
    document.getElementById("contextSection");

const machineTitle =
    document.getElementById("machineTitle");

const machineSubtitle =
    document.getElementById("machineSubtitle");

const goodHoursInput =
    document.getElementById("goodHours");

const replacementHoursInput =
    document.getElementById("replacementHours");

const totalHours =
    document.getElementById("totalHours");

const performanceBar =
    document.getElementById("performanceBar");

const balanceInput =
    document.getElementById("balance");

const occurrenceList =
    document.getElementById("occurrenceList");

const occurrenceEditor =
    document.getElementById("occurrenceEditor");

const occurrenceType =
    document.getElementById("occurrenceType");

const occurrenceDescription =
    document.getElementById("occurrenceDescription");

const observationInput =
    document.getElementById("observation");

const deleteMachineButton =
    document.getElementById("deleteMachineButton");


/* =========================================================
   UTILITÁRIOS
========================================================= */

function showLoading(show){

    document
        .getElementById("loading")
        .classList.toggle(
            "hidden",
            !show
        );

}


let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            () => {
                toast.classList.remove(
                    "show"
                );
            },
            2400
        );

}


function formatMachine(value){

    const number =
        Number(value);

    if(
        !Number.isFinite(number)
    ){
        return String(value);
    }

    return "M" +
        String(number).padStart(2,"0");

}


function machineNumber(value){

    const match =
        String(value || "")
            .trim()
            .toUpperCase()
            .match(/^M(\d+)$/);

    if(!match){
        return null;
    }

    const number =
        Number(match[1]);

    if(
        !Number.isInteger(number) ||
        number <= 0
    ){
        return null;
    }

    return number;
}


function normalizeMachine(value){

    if(
        typeof value === "number"
    ){
        return formatMachine(value);
    }

    const text =
        String(value || "")
            .trim()
            .toUpperCase();

    if(
        /^M\d+$/.test(text)
    ){

        return formatMachine(
            Number(
                text.substring(1)
            )
        );

    }

    if(
        /^\d+$/.test(text)
    ){

        return formatMachine(
            Number(text)
        );

    }

    return text;
}


function parseMinutes(value){

    if(
        value === null ||
        value === undefined
    ){
        return 0;
    }

    const text =
        String(value).trim();

    if(!text){
        return 0;
    }

    if(
        /^\d{1,3}:\d{2}$/.test(text)
    ){

        const parts =
            text.split(":");

        const hours =
            Number(parts[0]);

        const minutes =
            Number(parts[1]);

        if(
            !Number.isInteger(hours) ||
            !Number.isInteger(minutes) ||
            minutes > 59
        ){
            return 0;
        }

        return hours * 60 + minutes;
    }

    if(
        /^\d+$/.test(text)
    ){

        return Number(text);

    }

    return 0;
}


function minutesToHHMM(minutes){

    const total =
        Math.max(
            0,
            Math.round(
                Number(minutes) || 0
            )
        );

    const hours =
        Math.floor(
            total / 60
        );

    const mins =
        total % 60;

    return (
        String(hours).padStart(2,"0") +
        ":" +
        String(mins).padStart(2,"0")
    );
}


function getSectorMachines(sector){

    if(sector === "A"){

        return Array.from(
            {length:29},
            (_,index) =>
                index + 1
        );

    }

    if(sector === "B"){

        return Array.from(
            {length:22},
            (_,index) =>
                index + 30
        );

    }

    if(sector === "C"){

        return Array.from(
            {length:34},
            (_,index) =>
                index + 52
        );

    }

    return [];
}


function getStatusClass(totalMinutes){

    const target =
        shiftTargets[
            shiftInput.value
        ];

    if(
        totalMinutes >= target
    ){
        return "status-green";
    }

    if(
        totalMinutes >= target - 48
    ){
        return "status-yellow";
    }

    return "status-red";
}


function todayLocal(){

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;
}


/* =========================================================
   PERFIL
========================================================= */

async function carregarPerfil(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("usuarios")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .eq(
                "ativo",
                true
            )
            .single();

    if(error){

        console.error(error);

        throw new Error(
            "Não foi possível carregar seu perfil."
        );

    }

    currentProfile =
        data;

    leaderName.textContent =
        data.nome ||
        "Líder";


    const initials =
        String(
            data.nome || "U"
        )
        .split(" ")
        .filter(Boolean)
        .slice(0,2)
        .map(
            name =>
                name[0].toUpperCase()
        )
        .join("");

    userAvatar.textContent =
        initials || "U";
}


/* =========================================================
   CARREGAR APONTAMENTOS
========================================================= */

async function carregarDados(){

    showLoading(true);

    try{

        await renderMachineGrid();

    }catch(error){

        console.error(error);

        showToast(
            error.message ||
            "Erro ao carregar dados."
        );

    }finally{

        showLoading(false);

    }

}


/* =========================================================
   GRID
========================================================= */

async function renderMachineGrid(){

    machineGrid.innerHTML = "";

    const machines =
        getSectorMachines(
            sectorInput.value
        );

    const savedMachines =
        new Set();


    /*
     * A busca usa exatamente:
     * data + turno + setor + líder.
     */

    const {
        data,
        error
    } =
        await supabaseClient
            .from("apontamentos")
            .select("maquina")
            .eq(
                "data",
                dateInput.value
            )
            .eq(
                "turno",
                shiftInput.value
            )
            .eq(
                "setor",
                sectorInput.value
            )
            .eq(
                "lider_id",
                currentUser.id
            );


    if(error){

        console.error(error);

    }else{

        (data || []).forEach(
            item => {

                savedMachines.add(
                    normalizeMachine(
                        item.maquina
                    )
                );

            }
        );

    }


    machines.forEach(
        number => {

            const machine =
                formatMachine(number);

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "machine-button";

            if(
                savedMachines.has(machine)
            ){

                button.classList.add(
                    "saved"
                );

            }

            button.textContent =
                machine;

            button.onclick =
                () =>
                    abrirMaquina(machine);

            machineGrid.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   ABRIR MÁQUINA
========================================================= */

async function abrirMaquina(machine){

    machineAtual =
        normalizeMachine(machine);

    machineTitle.textContent =
        machineAtual;


    const parts =
        dateInput.value
            .split("-")
            .reverse()
            .join("/");


    machineSubtitle.textContent =
        `${parts} • ${shiftInput.value} • Setor ${sectorInput.value}`;


    mainHeader.classList.add(
        "hidden"
    );

    contextSection.classList.add(
        "hidden"
    );

    machineListSection.classList.add(
        "hidden"
    );

    machineScreen.classList.remove(
        "hidden"
    );


    await carregarFormulario();

}


/* =========================================================
   FECHAR MÁQUINA
========================================================= */

async function fecharTelaMaquina(){

    machineScreen.classList.add(
        "hidden"
    );

    mainHeader.classList.remove(
        "hidden"
    );

    contextSection.classList.remove(
        "hidden"
    );

    machineListSection.classList.remove(
        "hidden"
    );


    machineAtual =
        null;

    apontamentoAtual =
        null;

    ocorrenciasAtuais =
        [];

    occurrenceEditIndex =
        null;

    occurrenceEditor.classList.add(
        "hidden"
    );


    await renderMachineGrid();

}


/* =========================================================
   CARREGAR FORMULÁRIO
========================================================= */

async function carregarFormulario(){

    apontamentoAtual =
        null;

    ocorrenciasAtuais =
        [];

    occurrenceEditIndex =
        null;


    goodHoursInput.value =
        "";

    replacementHoursInput.value =
        "";

    balanceInput.value =
        "";

    observationInput.value =
        "";

    occurrenceEditor.classList.add(
        "hidden"
    );

    deleteMachineButton.classList.add(
        "hidden"
    );


    totalHours.textContent =
        "00:00";

    performanceBar.style.width =
        "0%";

    performanceBar.className =
        "performance-bar";


    const maquinaNumero =
        machineNumber(
            machineAtual
        );


    if(
        !maquinaNumero
    ){
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("apontamentos")
            .select("*")
            .eq(
                "data",
                dateInput.value
            )
            .eq(
                "turno",
                shiftInput.value
            )
            .eq(
                "setor",
                sectorInput.value
            )
            .eq(
                "lider_id",
                currentUser.id
            )
            .eq(
                "maquina",
                maquinaNumero
            )
            .maybeSingle();


    if(error){

        console.error(error);

        showToast(
            "Erro ao carregar máquina."
        );

        return;
    }


    if(data){

        apontamentoAtual =
            data;


        goodHoursInput.value =
            data.hora_boa != null
                ? minutesToHHMM(
                    data.hora_boa
                )
                : "";


        replacementHoursInput.value =
            data.reposicao != null
                ? minutesToHHMM(
                    data.reposicao
                )
                : "";


        balanceInput.value =
            data.saldo != null
                ? minutesToHHMM(
                    data.saldo
                )
                : "";


        observationInput.value =
            data.observacao ||
            "";


        deleteMachineButton.classList.remove(
            "hidden"
        );


        /*
         * A RPC já grava ocorrências
         * como JSONB dentro do apontamento.
         */

        if(
            Array.isArray(
                data.ocorrencias
            )
        ){

            ocorrenciasAtuais =
                data.ocorrencias.map(
                    item => ({

                        tipo:
                            item.tipo ||
                            "Outro",

                        descricao:
                            item.descricao ||
                            ""

                    })
                );

        }else{

            ocorrenciasAtuais =
                [];

        }

    }


    atualizarTotal();

    renderOccurrences();

}


/* =========================================================
   OCORRÊNCIAS
========================================================= */

function renderOccurrences(){

    occurrenceList.innerHTML = "";


    ocorrenciasAtuais.forEach(
        (item,index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "occurrence-item";


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "occurrence-content";


            const type =
                document.createElement(
                    "div"
                );

            type.className =
                "occurrence-type";

            type.textContent =
                item.tipo ||
                "Outro";


            const description =
                document.createElement(
                    "div"
                );

            description.className =
                "occurrence-description";

            description.textContent =
                item.descricao ||
                "";


            content.appendChild(
                type
            );

            content.appendChild(
                description
            );


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "occurrence-actions";


            const edit =
                document.createElement(
                    "button"
                );

            edit.className =
                "mini-button";

            edit.textContent =
                "✎";

            edit.onclick =
                () =>
                    editarOcorrencia(index);


            const del =
                document.createElement(
                    "button"
                );

            del.className =
                "mini-button delete";

            del.textContent =
                "×";

            del.onclick =
                () =>
                    removerOcorrencia(index);


            actions.appendChild(
                edit
            );

            actions.appendChild(
                del
            );


            row.appendChild(
                content
            );

            row.appendChild(
                actions
            );


            occurrenceList.appendChild(
                row
            );

        }
    );

}


function abrirEditorOcorrencia(){

    occurrenceEditIndex =
        null;

    occurrenceType.value =
        "Mecânico";

    occurrenceDescription.value =
        "";

    occurrenceEditor.classList.remove(
        "hidden"
    );

    occurrenceDescription.focus();

}


function cancelarEditorOcorrencia(){

    occurrenceEditIndex =
        null;

    occurrenceDescription.value =
        "";

    occurrenceEditor.classList.add(
        "hidden"
    );

}


function editarOcorrencia(index){

    const item =
        ocorrenciasAtuais[index];

    if(!item){
        return;
    }

    occurrenceEditIndex =
        index;

    occurrenceType.value =
        item.tipo ||
        "Outro";

    occurrenceDescription.value =
        item.descricao ||
        "";

    occurrenceEditor.classList.remove(
        "hidden"
    );

    occurrenceDescription.focus();

}


function salvarOcorrenciaLocal(){

    const tipo =
        occurrenceType.value;

    const descricao =
        occurrenceDescription.value
            .trim();


    if(!descricao){

        showToast(
            "Descreva a ocorrência."
        );

        return;
    }


    const item = {

        tipo:tipo,

        descricao:descricao

    };


    if(
        occurrenceEditIndex === null
    ){

        ocorrenciasAtuais.push(
            item
        );

    }else{

        ocorrenciasAtuais[
            occurrenceEditIndex
        ] = item;

    }


    occurrenceEditIndex =
        null;

    occurrenceDescription.value =
        "";

    occurrenceEditor.classList.add(
        "hidden"
    );


    renderOccurrences();

}


function removerOcorrencia(index){

    if(
        !confirm(
            "Excluir esta ocorrência?"
        )
    ){
        return;
    }


    ocorrenciasAtuais.splice(
        index,
        1
    );


    renderOccurrences();

}


/* =========================================================
   HORAS
========================================================= */

function atualizarTotal(){

    const good =
        parseMinutes(
            goodHoursInput.value
        );

    const replacement =
        parseMinutes(
            replacementHoursInput.value
        );

    const total =
        good + replacement;


    totalHours.textContent =
        minutesToHHMM(total);


    const target =
        shiftTargets[
            shiftInput.value
        ] || 0;


    let percent =
        target > 0
            ? (total / target) * 100
            : 0;


    percent =
        Math.min(
            100,
            Math.max(
                0,
                percent
            )
        );


    performanceBar.style.width =
        `${percent}%`;


    performanceBar.className =
        "performance-bar " +
        getStatusClass(total);

}


/* =========================================================
   SALVAR
========================================================= */

async function salvarMaquina(){

    if(!machineAtual){

        showToast(
            "Nenhuma máquina selecionada."
        );

        return;
    }


    showLoading(true);


    try{

        /*
         * M02 -> 2
         */
        const maquinaNumero =
            Number(
                machineAtual.replace(
                    "M",
                    ""
                )
            );


        if(
            !Number.isInteger(
                maquinaNumero
            ) ||
            maquinaNumero <= 0
        ){

            showToast(
                "Máquina inválida."
            );

            return;
        }


        /*
         * Todos os tempos são enviados
         * em minutos, conforme a função
         * existente no Supabase.
         */

        const horaBoa =
            parseMinutes(
                goodHoursInput.value
            );


        const reposicao =
            parseMinutes(
                replacementHoursInput.value
            );


        const totalBaixado =
            horaBoa +
            reposicao;


        const saldo =
            parseMinutes(
                balanceInput.value
            );


        const observacao =
            observationInput.value
                .trim();


        const ocorrencias =
            ocorrenciasAtuais
                .map(
                    item => ({

                        tipo:
                            item.tipo ||
                            "Outro",

                        descricao:
                            item.descricao ||
                            ""

                    })
                )
                .filter(
                    item =>
                        item.descricao
                            .trim()
                            .length > 0
                );


        /*
         * RPC EXISTENTE:
         *
         * salvar_apontamento_lider(
         *   p_data date,
         *   p_turno text,
         *   p_setor text,
         *   p_maquina integer,
         *   p_hora_boa integer,
         *   p_reposicao integer,
         *   p_total_baixado integer,
         *   p_saldo integer,
         *   p_observacao text,
         *   p_ocorrencias jsonb
         * )
         */

        const {
            data,
            error
        } =
            await supabaseClient
                .rpc(
                    "salvar_apontamento_lider",
                    {

                        p_data:
                            dateInput.value,

                        p_turno:
                            shiftInput.value,

                        p_setor:
                            sectorInput.value,

                        p_maquina:
                            maquinaNumero,

                        p_hora_boa:
                            horaBoa,

                        p_reposicao:
                            reposicao,

                        p_total_baixado:
                            totalBaixado,

                        p_saldo:
                            saldo,

                        p_observacao:
                            observacao ||
                            null,

                        p_ocorrencias:
                            ocorrencias

                    }
                );


        if(error){

            console.error(
                "Erro RPC:",
                error
            );

            throw error;

        }


        /*
         * A função retorna bigint.
         */

        if(data){

            apontamentoAtual = {
                id:data
            };

        }


        showToast(
            `${machineAtual} salvo ✓`
        );


        await renderMachineGrid();


        fecharTelaMaquina();


    }catch(error){

        console.error(
            "Erro ao salvar:",
            error
        );


        showToast(
            "Não foi possível salvar. " +
            (
                error.message ||
                "Erro desconhecido."
            )
        );


    }finally{

        showLoading(false);

    }

}


/* =========================================================
   EXCLUIR
========================================================= */

async function excluirMaquina(){

    if(
        !apontamentoAtual ||
        !apontamentoAtual.id
    ){

        showToast(
            "Não há apontamento para excluir."
        );

        return;
    }


    if(
        !confirm(
            `Excluir o apontamento da ${machineAtual}?`
        )
    ){

        return;

    }


    showLoading(true);


    try{

        /*
         * A exclusão é feita pela RPC segura
         * no Supabase, que verifica se o
         * apontamento pertence ao líder atual.
         */

        const {
            data,
            error
        } =
            await supabaseClient
                .rpc(
                    "excluir_apontamento_lider",
                    {
                        p_apontamento_id:
                            apontamentoAtual.id
                    }
                );


        if(error){

            console.error(
                "Erro RPC de exclusão:",
                error
            );

            throw error;

        }


        /*
         * A RPC retorna o ID realmente excluído.
         * Sem esse retorno, não mostramos sucesso.
         */

        if(
            data === null ||
            data === undefined
        ){

            throw new Error(
                "O apontamento não foi excluído."
            );

        }


        showToast(
            `${machineAtual} excluído ✓`
        );


        await fecharTelaMaquina();


    }catch(error){

        console.error(
            "Erro ao excluir:",
            error
        );

        showToast(
            "Não foi possível excluir. " +
            (
                error.message ||
                "Erro desconhecido."
            )
        );


    }finally{

        showLoading(false);

    }

}


/* =========================================================
   SAIR
========================================================= */

async function sair(){

    const confirmar =
        confirm(
            "Deseja sair do sistema?"
        );


    if(!confirmar){
        return;
    }


    showLoading(true);


    try{

        const {
            error
        } =
            await supabaseClient
                .auth
                .signOut();


        if(error){
            throw error;
        }


        window.location.href =
            "index.html";


    }catch(error){

        console.error(
            "Erro ao sair:",
            error
        );


        showToast(
            "Não foi possível sair."
        );


    }finally{

        showLoading(false);

    }

}

    async (
        event,
        session
    ) => {

        if(
            !session ||
            !session.user
        ){

            window.location.href =
                "index.html";

            return;
        }

        currentUser =
            session.user;

    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

async function init(){

    showLoading(true);


    try{

        const {
            data:{
                session
            }
        } =
            await supabaseClient
                .auth
                .getSession();


        if(
            !session ||
            !session.user
        ){

            window.location.href =
                "index.html";

            return;

        }


        currentUser =
            session.user;


        await carregarPerfil();


        if(!dateInput.value){

            dateInput.value =
                todayLocal();

        }


        shiftInput.value =
            "1º turno";


        sectorInput.value =
            "A";


        await carregarDados();


    }catch(error){

        console.error(
            "Erro na inicialização:",
            error
        );


        showToast(
            error.message ||
            "Não foi possível carregar o sistema."
        );


    }finally{

        showLoading(false);

    }

}


init();
