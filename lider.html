<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Controle de Produção</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#f2f2f7;
    --card:#fff;
    --text:#111;
    --muted:#8e8e93;
    --line:#e5e5ea;
    --blue:#007aff;
    --green:#34c759;
    --red:#ff3b30;
    --yellow:#ffcc00;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
}

button,input,select,textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.app{
    min-height:100vh;
    padding-bottom:110px;
}

.header{
    position:sticky;
    top:0;
    z-index:20;
    padding:
        calc(14px + env(safe-area-inset-top))
        18px 14px;
    background:rgba(242,242,247,.88);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(0,0,0,.06);
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header-title{
    font-size:22px;
    font-weight:750;
    letter-spacing:-.6px;
}

.header-subtitle{
    color:var(--muted);
    font-size:13px;
    margin-top:3px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;
}

.container{
    width:min(900px,100%);
    margin:auto;
    padding:18px;
}

.card{
    background:var(--card);
    border-radius:22px;
    padding:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.05);
    margin-bottom:14px;
}

.leader-card{
    padding:20px;
}

.leader-label{
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    margin-bottom:4px;
}

.leader-name{
    font-size:22px;
    font-weight:750;
    letter-spacing:-.4px;
}

.context-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:18px;
}

.context-date{
    grid-column:1 / -1;
}

.field-label{
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
}

input,
select,
textarea{
    width:100%;
    border:0;
    outline:none;
    background:#f2f2f7;
    border-radius:13px;
    padding:12px 13px;
    color:var(--text);
}

.section-title{
    font-size:17px;
    font-weight:750;
    margin:24px 4px 10px;
}

.machine-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.machine{
    min-height:76px;
    background:var(--card);
    border-radius:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
    position:relative;
    transition:.18s;
}

.machine:active{
    transform:scale(.96);
}

.machine-code{
    font-size:16px;
    font-weight:750;
}

.machine-time{
    margin-top:4px;
    font-size:12px;
    color:var(--muted);
}

.machine.saved{
    background:#e9f9ee;
}

.machine.saved .machine-code{
    color:#168a39;
}

.machine-check{
    position:absolute;
    top:7px;
    right:8px;
    color:var(--green);
    font-size:12px;
    font-weight:800;
}

.machine-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.machine-header h2{
    margin:0;
    font-size:28px;
    letter-spacing:-.7px;
}

.back-button{
    background:#e5e5ea;
    color:#111;
    border-radius:12px;
    padding:9px 13px;
    font-weight:650;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.total-box{
    margin-top:14px;
    border-radius:16px;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#f2f2f7;
}

.total-label{
    font-size:13px;
    color:var(--muted);
}

.total-value{
    font-size:24px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
}

.status-green{
    background:#e9f9ee!important;
    color:#168a39;
}

.status-yellow{
    background:#fff8d9!important;
    color:#8a6900;
}

.status-red{
    background:#ffe9e7!important;
    color:#c9281f;
}

.occurrence-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:12px;
}

.occurrence{
    display:flex;
    align-items:center;
    gap:10px;
    background:#f2f2f7;
    border-radius:14px;
    padding:11px 12px;
}

.occurrence-content{
    flex:1;
    min-width:0;
}

.occurrence-type{
    font-size:12px;
    font-weight:750;
    color:var(--blue);
}

.occurrence-description{
    font-size:14px;
    margin-top:3px;
    word-break:break-word;
}

.occurrence-actions{
    display:flex;
    gap:5px;
}

.small-button{
    width:34px;
    height:34px;
    border-radius:10px;
    background:#fff;
    color:#555;
}

.add-occurrence{
    width:100%;
    background:#f2f2f7;
    color:var(--blue);
    padding:13px;
    border-radius:14px;
    font-weight:700;
    margin-top:10px;
}

.occurrence-editor{
    margin-top:12px;
    padding:14px;
    border-radius:16px;
    background:#f2f2f7;
}

.editor-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.secondary{
    flex:1;
    padding:12px;
    border-radius:13px;
    background:#fff;
}

.primary{
    flex:1;
    padding:12px;
    border-radius:13px;
    background:var(--blue);
    color:#fff;
    font-weight:700;
}

.delete-machine{
    width:100%;
    margin-top:4px;
    padding:14px;
    border-radius:14px;
    background:#fff;
    color:var(--red);
    font-weight:650;
    border:1px solid #f0d0cd;
}

.delete-machine:active{
    background:#fff0ef;
}

.bottom-action{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:30;
    padding:
        12px
        18px
        calc(12px + env(safe-area-inset-bottom));
    background:rgba(242,242,247,.9);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}

.save-button{
    width:min(900px,100%);
    display:block;
    margin:auto;
    background:var(--green);
    color:#fff;
    padding:15px;
    border-radius:17px;
    font-size:16px;
    font-weight:750;
    box-shadow:0 6px 20px rgba(52,199,89,.25);
}

.summary-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

.summary-table th{
    color:var(--muted);
    font-weight:600;
    text-align:left;
    padding:8px 4px;
    border-bottom:1px solid var(--line);
}

.summary-table td{
    padding:10px 4px;
    border-bottom:1px solid var(--line);
}

.summary-table tr:last-child td{
    border-bottom:0;
}

.logout{
    width:100%;
    margin-top:18px;
    padding:13px;
    border-radius:14px;
    background:#fff;
    color:var(--red);
    font-weight:650;
}

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%) translateY(15px);
    background:#111;
    color:#fff;
    padding:11px 16px;
    border-radius:14px;
    font-size:14px;
    font-weight:650;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.loading{
    text-align:center;
    color:var(--muted);
    padding:30px 10px;
}

@media(max-width:600px){

    .machine-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .machine{
        min-height:72px;
    }

    .context-grid{
        gap:10px;
    }

    .context-grid input,
    .context-grid select{
        padding:11px 10px;
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="header-top">
        <div>
            <div class="header-title">CONTROLE DE PRODUÇÃO</div>
            <div class="header-subtitle">Setor de Injeção</div>
        </div>

        <div class="avatar" id="avatar">--</div>
    </div>
</header>

<main class="container">

<section id="dashboard">

    <div class="card leader-card">

        <div class="leader-label">
            LÍDER
        </div>

        <div id="leaderName" class="leader-name">
            Carregando...
        </div>

        <div class="context-grid">

            <div class="context-date">
                <div class="field-label">Data</div>

                <input
                    id="date"
                    type="date"
                >
            </div>

            <div>
                <div class="field-label">Turno</div>

                <select id="shift">
                    <option>1º turno</option>
                    <option>2º turno</option>
                    <option>3º turno</option>
                </select>
            </div>

            <div>
                <div class="field-label">Setor</div>

                <select id="sector">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>

        </div>

    </div>


    <div class="section-title">
        Máquinas
    </div>

    <div id="machineGrid" class="machine-grid">
        <div class="loading">
            Carregando...
        </div>
    </div>


    <div class="section-title">
        Fechamento
    </div>

    <div class="card">

        <div
            id="summaryEmpty"
            style="color:#8e8e93;font-size:14px;"
        >
            Nenhuma máquina salva ainda.
        </div>

        <div id="summaryContent" class="hidden">

            <table class="summary-table">

                <thead>
                    <tr>
                        <th>Máquina</th>
                        <th>Total</th>
                        <th>Saldo</th>
                    </tr>
                </thead>

                <tbody id="summaryBody"></tbody>

            </table>

        </div>

    </div>


    <button
        class="logout"
        onclick="logout()"
    >
        Sair
    </button>

</section>


<section id="machineScreen" class="hidden">

    <div class="machine-header">

        <button
            class="back-button"
            onclick="backToDashboard()"
        >
            ‹ Voltar
        </button>

        <h2 id="machineTitle">
            M01
        </h2>

        <div style="width:65px;"></div>

    </div>


    <div class="card">

        <div
            class="section-title"
            style="margin:0 0 12px;"
        >
            Produção
        </div>

        <div class="form-grid">

            <div>

                <div class="field-label">
                    Hora boa
                </div>

                <input
                    id="goodHours"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    placeholder="00:00"
                    oninput="formatTimeInput(this); calculateTotal()"
                >

            </div>


            <div>

                <div class="field-label">
                    Reposição
                </div>

                <input
                    id="replacementHours"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    placeholder="00:00"
                    oninput="formatTimeInput(this); calculateTotal()"
                >

            </div>

        </div>


        <div id="totalBox" class="total-box">

            <div class="total-label">
                Total baixado
            </div>

            <div
                id="totalHours"
                class="total-value"
            >
                00:00
            </div>

        </div>

    </div>


    <div class="card">

        <div
            class="section-title"
            style="margin:0 0 12px;"
        >
            Saldo
        </div>

        <input
            id="balance"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="00:00"
            oninput="formatBalanceInput(this)"
        >

    </div>


    <div class="card">

        <div
            class="section-title"
            style="margin:0;"
        >
            Ocorrências
        </div>

        <div
            id="occurrenceList"
            class="occurrence-list"
        ></div>


        <button
            class="add-occurrence"
            onclick="openOccurrenceEditor()"
        >
            + Adicionar ocorrência
        </button>


        <div
            id="occurrenceEditor"
            class="occurrence-editor hidden"
        >

            <div class="field-label">
                Tipo
            </div>

            <select id="occurrenceType">

                <option>Mecânico</option>
                <option>Elétrico</option>
                <option>Matriz</option>
                <option>Material</option>
                <option>Processo</option>
                <option>Parada de máquina</option>
                <option>Setup</option>
                <option>Outro</option>

            </select>


            <div
                class="field-label"
                style="margin-top:10px;"
            >
                Descrição
            </div>

            <textarea
                id="occurrenceDescription"
                placeholder="Descreva o problema..."
            ></textarea>


            <div class="editor-actions">

                <button
                    class="secondary"
                    onclick="cancelOccurrence()"
                >
                    Cancelar
                </button>

                <button
                    class="primary"
                    onclick="saveOccurrence()"
                >
                    Salvar
                </button>

            </div>

        </div>

    </div>


    <div class="card">

        <div
            class="section-title"
            style="margin:0 0 12px;"
        >
            Observação
        </div>

        <textarea
            id="observation"
            placeholder="Observação geral da máquina..."
        ></textarea>

    </div>


    <div
        id="deleteMachineCard"
        class="card hidden"
        style="padding:14px;"
    >

        <button
            class="delete-machine"
            onclick="deleteMachine()"
        >
            Excluir lançamento desta máquina
        </button>

    </div>

</section>

</main>


<div id="bottomAction" class="bottom-action hidden">

    <button
        class="save-button"
        onclick="saveMachine()"
    >
        Salvar máquina
    </button>

</div>


<div id="toast" class="toast"></div>

</div>


<script>

const SUPABASE_URL =
    "https://icajmncojvidhrqlbevq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vQFsGutuZDHBruMghZkQYQ_BSwEBXFp";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;
let currentProfile = null;
let currentTurn = null;
let currentMachine = null;
let machineData = {};
let editingOccurrence = null;
let loadingData = false;


const sectorMachines = {

    A:{
        start:1,
        end:29
    },

    B:{
        start:30,
        end:51
    },

    C:{
        start:52,
        end:85
    }

};


const shiftTargets = {

    "1º turno":
        8 * 60 + 48,

    "2º turno":
        8 * 60 + 36,

    "3º turno":
        6 * 60 + 36

};


document.addEventListener(
    "DOMContentLoaded",
    initialize
);


async function initialize(){

    document
        .getElementById("date")
        .value =
        new Date()
            .toISOString()
            .split("T")[0];


    document
        .getElementById("shift")
        .addEventListener(
            "change",
            loadProductionData
        );


    document
        .getElementById("sector")
        .addEventListener(
            "change",
            loadProductionData
        );


    document
        .getElementById("date")
        .addEventListener(
            "change",
            loadProductionData
        );


    const {
        data:{
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();


    if(!session){

        window.location.href =
            "index.html";

        return;
    }


    currentUser =
        session.user;


    await loadProfile();

}


async function loadProfile(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("usuarios")
            .select("*")
            .eq("id", currentUser.id)
            .eq("ativo", true)
            .single();


    if(error || !data){

        alert(
            "Não foi possível carregar seu perfil."
        );

        await supabaseClient
            .auth
            .signOut();

        window.location.href =
            "index.html";

        return;
    }


    if(data.perfil !== "lider"){

        alert(
            "Este usuário não possui acesso de líder."
        );

        await supabaseClient
            .auth
            .signOut();

        window.location.href =
            "index.html";

        return;
    }


    currentProfile = data;


    document
        .getElementById("leaderName")
        .textContent =
            data.nome;


    document
        .getElementById("avatar")
        .textContent =
            getInitials(data.nome);


    await loadProductionData();

}


async function loadProductionData(){

    if(!currentProfile)
        return;


    if(currentMachine){
        backToDashboard();
    }


    loadingData = true;
    machineData = {};
    currentTurn = null;

    renderMachines();


    const date =
        document
            .getElementById("date")
            .value;


    const shift =
        document
            .getElementById("shift")
            .value;


    const sector =
        document
            .getElementById("sector")
            .value;


    const {
        data:turn,
        error:turnError
    } =
        await supabaseClient
            .from("turnos")
            .select("*")
            .eq("data", date)
            .eq("turno", shift)
            .eq("setor", sector)
            .eq("lider_id", currentUser.id)
            .maybeSingle();


    if(turnError){

        console.error(turnError);

        showToast(
            "Erro ao carregar os dados."
        );

        loadingData = false;

        renderMachines();

        return;
    }


    currentTurn = turn;


    if(!turn){

        loadingData = false;

        renderMachines();

        return;
    }


    const {
        data:records,
        error
    } =
        await supabaseClient
            .from("apontamentos")
            .select(`
                *,
                ocorrencias(*)
            `)
            .eq("turno_id", turn.id)
            .order("maquina", {
                ascending:true
            });


    if(error){

        console.error(error);

        showToast(
            "Erro ao carregar os apontamentos."
        );

        loadingData = false;

        renderMachines();

        return;
    }


    (records || []).forEach(record => {

        const id =
            String(record.maquina)
                .padStart(2,"0");


        machineData[id] = {

            id:record.id,

            good:
                record.horas_boas || "",

            replacement:
                record.horas_reposicao || "",

            total:
                record.horas_baixadas || "00:00",

            balance:
                record.saldo || "",

            observation:
                record.observacao || "",

            occurrences:
                (record.ocorrencias || [])
                    .map(item => ({

                        id:item.id,

                        type:
                            item.tipo || "Outro",

                        description:
                            item.descricao || ""

                    }))

        };

    });


    loadingData = false;

    renderMachines();

}


async function getOrCreateTurn(){

    const date =
        document
            .getElementById("date")
            .value;


    const shift =
        document
            .getElementById("shift")
            .value;


    const sector =
        document
            .getElementById("sector")
            .value;


    if(
        currentTurn &&
        currentTurn.data === date &&
        currentTurn.turno === shift &&
        currentTurn.setor === sector
    ){

        return currentTurn;

    }


    const {
        data:existing,
        error:findError
    } =
        await supabaseClient
            .from("turnos")
            .select("*")
            .eq("data", date)
            .eq("turno", shift)
            .eq("setor", sector)
            .eq("lider_id", currentUser.id)
            .maybeSingle();


    if(findError)
        throw findError;


    if(existing){

        currentTurn = existing;

        return existing;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("turnos")
            .insert({

                data:date,

                turno:shift,

                setor:sector,

                lider_id:
                    currentUser.id

            })
            .select()
            .single();


    if(error)
        throw error;


    currentTurn = data;

    return data;

}


function formatTimeInput(el){

    let value =
        el.value
            .replace(/[^\d:]/g,"");


    if(value.includes(":")){

        const parts =
            value.split(":");


        const hours =
            parts[0].slice(0,2);


        const minutes =
            (parts[1] || "")
                .slice(0,2);


        el.value =
            hours + ":" + minutes;


        return;

    }


    value =
        value.slice(0,4);


    if(value.length > 2){

        value =
            value.slice(0,2) +
            ":" +
            value.slice(2);

    }


    el.value =
        value;

}


function formatBalanceInput(el){

    let value =
        el.value;


    const negative =
        value.startsWith("-");


    value =
        value.replace(/[^\d:]/g,"");


    if(value.includes(":")){

        const parts =
            value.split(":");


        const hours =
            parts[0].slice(0,2);


        const minutes =
            (parts[1] || "")
                .slice(0,2);


        el.value =
            (negative ? "-" : "") +
            hours +
            ":" +
            minutes;


        return;

    }


    value =
        value.slice(0,4);


    if(value.length > 2){

        value =
            value.slice(0,2) +
            ":" +
            value.slice(2);

    }


    el.value =
        (negative ? "-" : "") +
        value;

}


function timeToMinutes(value){

    if(!value)
        return 0;


    const negative =
        value.startsWith("-");


    value =
        value.replace("-","");


    const parts =
        value.split(":");


    const hours =
        parseInt(parts[0],10) || 0;


    const minutes =
        parseInt(parts[1],10) || 0;


    const total =
        hours * 60 + minutes;


    return negative
        ? -total
        : total;

}


function minutesToTime(minutes){

    if(minutes === 0)
        return "00:00";


    if(minutes < 0){

        return "-" +
            minutesToTime(
                Math.abs(minutes)
            );

    }


    const hours =
        Math.floor(minutes / 60);


    const mins =
        minutes % 60;


    return String(hours)
        .padStart(2,"0")
        +
        ":" +
        String(mins)
        .padStart(2,"0");

}


function getStatusClass(totalMinutes){

    const shift =
        document
            .getElementById("shift")
            .value;


    const target =
        shiftTargets[shift];


    if(totalMinutes >= target)
        return "status-green";


    if(totalMinutes >= target - 48)
        return "status-yellow";


    return "status-red";

}


function calculateTotal(){

    const good =
        timeToMinutes(
            document
                .getElementById("goodHours")
                .value
        );


    const replacement =
        timeToMinutes(
            document
                .getElementById("replacementHours")
                .value
        );


    const total =
        good + replacement;


    document
        .getElementById("totalHours")
        .textContent =
            minutesToTime(total);


    const box =
        document
            .getElementById("totalBox");


    box.classList.remove(
        "status-green",
        "status-yellow",
        "status-red"
    );


    box.classList.add(
        getStatusClass(total)
    );

}


function getCurrentSector(){

    return document
        .getElementById("sector")
        .value;

}


function getSectorMachines(){

    const sector =
        getCurrentSector();


    const config =
        sectorMachines[sector];


    const machines = [];


    for(
        let i = config.start;
        i <= config.end;
        i++
    ){

        machines.push(
            String(i).padStart(2,"0")
        );

    }


    return machines;

}


function renderMachines(){

    const grid =
        document
            .getElementById("machineGrid");


    grid.innerHTML = "";


    if(loadingData){

        grid.innerHTML = `

            <div
                class="loading"
                style="grid-column:1/-1;"
            >
                Carregando...
            </div>

        `;


        renderSummary();

        return;
    }


    const machines =
        getSectorMachines();


    machines.forEach(id => {

        const button =
            document.createElement("button");


        button.className =
            "machine";


        const data =
            machineData[id];


        if(data){

            button.classList.add(
                "saved"
            );


            button.innerHTML = `

                <span class="machine-check">
                    ✓
                </span>

                <span class="machine-code">
                    M${id}
                </span>

                <span class="machine-time">
                    ${escapeHtml(
                        data.total || "00:00"
                    )}
                </span>

            `;

        }else{

            button.innerHTML = `

                <span class="machine-code">
                    M${id}
                </span>

                <span class="machine-time">
                    Toque para abrir
                </span>

            `;

        }


        button.onclick =
            () => openMachine(id);


        grid.appendChild(button);

    });


    renderSummary();

}


function renderSummary(){

    const body =
        document
            .getElementById("summaryBody");


    const empty =
        document
            .getElementById("summaryEmpty");


    const content =
        document
            .getElementById("summaryContent");


    body.innerHTML = "";


    const machines =
        Object.keys(machineData)
            .sort(
                (a,b) =>
                    Number(a) - Number(b)
            );


    if(machines.length === 0){

        empty.classList.remove(
            "hidden"
        );

        content.classList.add(
            "hidden"
        );

        return;
    }


    empty.classList.add(
        "hidden"
    );


    content.classList.remove(
        "hidden"
    );


    machines.forEach(id => {

        const data =
            machineData[id];


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>M${id}</td>

            <td>
                ${escapeHtml(
                    data.total || "00:00"
                )}
            </td>

            <td>
                ${
                    data.balance
                    ? escapeHtml(data.balance)
                    : "—"
                }
            </td>

        `;


        body.appendChild(row);

    });

}


function openMachine(id){

    currentMachine = id;


    document
        .getElementById("dashboard")
        .classList.add("hidden");


    document
        .getElementById("machineScreen")
        .classList.remove("hidden");


    document
        .getElementById("bottomAction")
        .classList.remove("hidden");


    document
        .getElementById("machineTitle")
        .textContent =
            "M" + id;


    const data =
        machineData[id] || {

            good:"",

            replacement:"",

            balance:"",

            observation:"",

            occurrences:[]

        };


    document
        .getElementById("goodHours")
        .value =
            data.good || "";


    document
        .getElementById("replacementHours")
        .value =
            data.replacement || "";


    document
        .getElementById("balance")
        .value =
            data.balance || "";


    document
        .getElementById("observation")
        .value =
            data.observation || "";


    const deleteCard =
        document
            .getElementById(
                "deleteMachineCard"
            );


    if(
        machineData[id] &&
        machineData[id].id
    ){

        deleteCard.classList.remove(
            "hidden"
        );

    }else{

        deleteCard.classList.add(
            "hidden"
        );

    }


    renderOccurrences(
        data.occurrences || []
    );


    document
        .getElementById("occurrenceEditor")
        .classList.add("hidden");


    editingOccurrence = null;


    calculateTotal();

}


function backToDashboard(){

    currentMachine = null;


    document
        .getElementById("machineScreen")
        .classList.add("hidden");


    document
        .getElementById("dashboard")
        .classList.remove("hidden");


    document
        .getElementById("bottomAction")
        .classList.add("hidden");


    renderMachines();

}


function openOccurrenceEditor(index = null){

    editingOccurrence =
        index;


    document
        .getElementById("occurrenceEditor")
        .classList.remove("hidden");


    if(index !== null){

        const occurrence =
            machineData[currentMachine]
                .occurrences[index];


        document
            .getElementById("occurrenceType")
            .value =
                occurrence.type;


        document
            .getElementById(
                "occurrenceDescription"
            )
            .value =
                occurrence.description;

    }else{

        document
            .getElementById("occurrenceType")
            .value =
                "Mecânico";


        document
            .getElementById(
                "occurrenceDescription"
            )
            .value =
                "";

    }


    document
        .getElementById(
            "occurrenceDescription"
        )
        .focus();

}


function cancelOccurrence(){

    editingOccurrence = null;


    document
        .getElementById(
            "occurrenceEditor"
        )
        .classList.add("hidden");

}


function saveOccurrence(){

    const type =
        document
            .getElementById(
                "occurrenceType"
            )
            .value;


    const description =
        document
            .getElementById(
                "occurrenceDescription"
            )
            .value
            .trim();


    if(!description){

        showToast(
            "Digite uma descrição."
        );

        return;
    }


    if(!machineData[currentMachine]){

        machineData[currentMachine] = {

            good:"",

            replacement:"",

            balance:"",

            observation:"",

            occurrences:[]

        };

    }


    if(
        !machineData[currentMachine]
            .occurrences
    ){

        machineData[currentMachine]
            .occurrences = [];

    }


    const occurrence = {

        type,

        description

    };


    if(editingOccurrence === null){

        machineData[currentMachine]
            .occurrences
            .push(occurrence);

    }else{

        machineData[currentMachine]
            .occurrences[
                editingOccurrence
            ] =
                occurrence;

    }


    editingOccurrence = null;


    document
        .getElementById(
            "occurrenceEditor"
        )
        .classList.add("hidden");


    renderOccurrences(
        machineData[currentMachine]
            .occurrences
    );

}


function renderOccurrences(list){

    const container =
        document
            .getElementById(
                "occurrenceList"
            );


    container.innerHTML = "";


    if(!list || list.length === 0){

        container.innerHTML = `

            <div
                style="
                    color:#8e8e93;
                    font-size:14px;
                    padding:4px 0;
                "
            >
                Nenhuma ocorrência registrada.
            </div>

        `;

        return;
    }


    list.forEach((item,index) => {

        const row =
            document.createElement("div");


        row.className =
            "occurrence";


        row.innerHTML = `

            <div class="occurrence-content">

                <div class="occurrence-type">
                    ${escapeHtml(item.type)}
                </div>

                <div class="occurrence-description">
                    ${escapeHtml(
                        item.description
                    )}
                </div>

            </div>

            <div class="occurrence-actions">

                <button
                    class="small-button"
                    onclick="openOccurrenceEditor(${index})"
                >
                    ✎
                </button>

                <button
                    class="small-button"
                    onclick="deleteOccurrence(${index})"
                >
                    ×
                </button>

            </div>

        `;


        container.appendChild(row);

    });

}


async function deleteOccurrence(index){

    const occurrence =
        machineData[currentMachine]
            .occurrences[index];


    if(!confirm(
        "Excluir esta ocorrência?"
    )){
        return;
    }


    if(occurrence.id){

        const {
            error
        } =
            await supabaseClient
                .from("ocorrencias")
                .delete()
                .eq(
                    "id",
                    occurrence.id
                );


        if(error){

            console.error(error);

            showToast(
                "Erro ao excluir."
            );

            return;
        }

    }


    machineData[currentMachine]
        .occurrences
        .splice(index,1);


    renderOccurrences(
        machineData[currentMachine]
            .occurrences
    );


    showToast(
        "Ocorrência excluída."
    );

}


async function saveMachine(){

    if(!currentMachine)
        return;


    const button =
        document.querySelector(
            ".save-button"
        );


    const originalText =
        button.textContent;


    button.disabled = true;

    button.textContent =
        "Salvando...";


    try{

        const turn =
            await getOrCreateTurn();


        const good =
            document
                .getElementById(
                    "goodHours"
                )
                .value
                .trim();


        const replacement =
            document
                .getElementById(
                    "replacementHours"
                )
                .value
                .trim();


        const balance =
            document
                .getElementById(
                    "balance"
                )
                .value
                .trim();


        const observation =
            document
                .getElementById(
                    "observation"
                )
                .value
                .trim();


        const totalMinutes =
            timeToMinutes(good) +
            timeToMinutes(replacement);


        const total =
            minutesToTime(totalMinutes);


        const payload = {

            turno_id:
                turn.id,

            maquina:
                Number(currentMachine),

            horas_boas:
                good || null,

            horas_reposicao:
                replacement || null,

            horas_baixadas:
                total,

            saldo:
                balance || null,

            observacao:
                observation || null

        };


        const {
            data:savedRecord,
            error
        } =
            await supabaseClient
                .from("apontamentos")
                .upsert(
                    payload,
                    {
                        onConflict:
                            "turno_id,maquina"
                    }
                )
                .select()
                .single();


        if(error)
            throw error;


        const {
            error:deleteError
        } =
            await supabaseClient
                .from("ocorrencias")
                .delete()
                .eq(
                    "apontamento_id",
                    savedRecord.id
                );


        if(deleteError)
            throw deleteError;


        const occurrences =
            machineData[currentMachine]
                ?.occurrences || [];


        if(occurrences.length > 0){

            const rows =
                occurrences.map(item => ({

                    apontamento_id:
                        savedRecord.id,

                    tipo:
                        item.type,

                    descricao:
                        item.description

                }));


            const {
                error:occurrenceError
            } =
                await supabaseClient
                    .from("ocorrencias")
                    .insert(rows);


            if(occurrenceError)
                throw occurrenceError;

        }


        machineData[currentMachine] = {

            id:
                savedRecord.id,

            good,

            replacement,

            total,

            balance,

            observation,

            occurrences

        };


        showToast(
            "M" +
            currentMachine +
            " salvo ✓"
        );


        setTimeout(() => {

            backToDashboard();

        },500);


    }catch(error){

        console.error(error);

        showToast(
            "Não foi possível salvar."
        );

    }finally{

        button.disabled = false;

        button.textContent =
            originalText;

    }

}


async function deleteMachine(){

    if(!currentMachine)
        return;


    const data =
        machineData[currentMachine];


    if(!data || !data.id){

        showToast(
            "Esta máquina ainda não foi salva."
        );

        return;
    }


    const confirmed =
        confirm(
            "Excluir o lançamento da M" +
            currentMachine +
            "?\n\n" +
            "Isso removerá horas, saldo, observação " +
            "e todas as ocorrências desta máquina."
        );


    if(!confirmed)
        return;


    const deleteButton =
        document.querySelector(
            ".delete-machine"
        );


    deleteButton.disabled = true;

    deleteButton.textContent =
        "Excluindo...";


    try{

        const {
            error:occurrenceError
        } =
            await supabaseClient
                .from("ocorrencias")
                .delete()
                .eq(
                    "apontamento_id",
                    data.id
                );


        if(occurrenceError)
            throw occurrenceError;


        const {
            error:apontamentoError
        } =
            await supabaseClient
                .from("apontamentos")
                .delete()
                .eq(
                    "id",
                    data.id
                );


        if(apontamentoError)
            throw apontamentoError;


        delete machineData[currentMachine];


        showToast(
            "Lançamento da M" +
            currentMachine +
            " excluído ✓"
        );


        setTimeout(() => {

            backToDashboard();

        },500);


    }catch(error){

        console.error(error);

        showToast(
            "Não foi possível excluir."
        );


        deleteButton.disabled = false;

        deleteButton.textContent =
            "Excluir lançamento desta máquina";

    }

}


async function logout(){

    if(!confirm(
        "Sair do controle de produção?"
    )){
        return;
    }


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}


function getInitials(name){

    if(!name)
        return "--";


    const parts =
        name
            .trim()
            .split(/\s+/);


    if(parts.length === 1){

        return parts[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();

}


function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function showToast(message){

    const toast =
        document
            .getElementById("toast");


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },2200);

}

</script>
